<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scribbler's Arcade</title>
<style>
  html,body{margin:0;height:100%;background:#efe9d8;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;outline:none;cursor:default}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
'use strict';
/* =====================================================================
   INVADERS
   Every frame is a fresh "page": every line is re-inked with a new wobble
   at 12 pages/sec (animation "on twos"), while motion runs at 60fps.
   ===================================================================== */

const TAU = Math.PI * 2;
const GW = 900, GH = 800;               // logical playfield
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- deterministic randomness ---------- */
function hash(a, b, c) {
  let h = Math.imul((a | 0) + 0x9e3779b9, 374761393) ^ Math.imul((b | 0) + 0x7f4a7c15, 668265263) ^ Math.imul((c | 0) + 0x165667b1, 1274126177);

const rnd = Math.random;

/* ---------- canvases ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const inkC = document.createElement('canvas'), IX = inkC.getContext('2d');
const ghostC = document.createElement('canvas'), GHX = ghostC.getContext('2d');
let G = IX;                  // current pen target
let W = 0, H = 0, DPR = 1, SC = 1, OX = 0, OY = 0;
let papers = [], noiseTile = null, paperSq = null, paperBlack = null;
let boil = -1, pageIdx = 0, pjx = 0, pjy = 0;
let clock = 0;               // real time (s), drives the boil
let animT = 0;               // game time (s), drives limb animation

const INK = 'rgba(22,42,148,0.87)';
const INK_LIGHT = 'rgba(22,42,148,0.42)';
const RED = 'rgba(196,28,36,0.88)';
let PENCOL = INK;                 // current biro
/* ---------- dark mode: a blackboard instead of paper ----------
   Every pen colour is swapped at the moment it touches the page for a bright one that reads on
   near-black (blue biro -> pale blue, red -> pink-red, green -> mint, black -> white); anything
   else dark is lifted towards white. The drawings themselves don't change. */
let DARK = false, THEME_N = 0, NOTES = [];   // NOTES: paper notes on the page this frame (device boxes); ink on them keeps its paper colours

const DARKMAP = { '22,42,148': [150, 195, 255], '196,28,36': [255, 112, 122], '20,118,56': [112, 226, 150], '26,26,32': [238, 236, 226], '150,10,20': [255, 92, 104], '12,22,100': [130, 172, 248], '110,160,215': [78, 96, 124] };
const TCM = new Map();

  let v = TCM.get(c); if (v) return v;
  let r, g, b, a = 1, m;
  if ((m = /^rgba?\(([^)]+)\)/.exec(c))) { const q = m[1].split(',').map(Number); [r, g, b] = q; if (q.length > 3) a = q[3]; }

}
function onNote(x, y) {                                  // is this point (in G's units) on a paper note?
  if (!DARK || !NOTES.length || G !== IX) return false;
  const m = G.getTransform(), px = m.a * x + m.c * y + m.e, py = m.b * x + m.d * y + m.f;

}
function setDark(v) {
  DARK = !!v; TCM.clear(); THEME_N++;

}

/* =====================================================================
   BALLPOINT PEN
   ===================================================================== */
let SEEDC = 1;
let CRAYON = 0;                    // >0: the same strokes come out as wax crayon, this many times fatter
/* ---------- wax crayon ----------

   scraped off along the way. Press hard and they pile up solid; go light and only a few catch, so the
   paper shows through. Every fleck is placed from the stroke's own seed and the page number, so each

const WAXSPR = new Map();
function waxSprites(col) {

    const lobes = 4 + ((R() * 5) | 0), ph = R() * TAU, sq = 0.42 + R() * 0.3;

    const streaks = kind === 'heavy' ? 3 : 9, pits = kind === 'heavy' ? 5 : 16;   // wax skips the paper's valleys: fine streaks and tiny pits
    for (let k = 0; k < streaks; k++) { g.beginPath(); g.ellipse(R() * N, N / 2 + (R() - .5) * N * sq * 0.9, 2 + R() * 6, 0.25 + R() * 0.4, (R() - .5) * 0.12, 0, TAU); g.fillStyle = `rgba(0,0,0,${0.6 + R() * 0.4})`; g.fill(); }
    for (let k = 0; k < pits; k++) { g.beginPath(); g.arc(R() * N, N / 2 + (R() - .5) * N * sq, 0.3 + R() * 0.7, 0, TAU); g.fillStyle = '#000'; g.fill(); }

}
function waxStroke(X, Y, S, m, w, col, sd, bf, o) {

  const Lt = S[m - 1], press = o.press === undefined ? 1 : o.press, step = Math.max(0.5, w * 0.24), wv = hash(sd, 0, 1) * 6, wv2 = hash(sd, bf, 2) * 6;
  let seg = 1, k = 0;
  for (let s = 0; s <= Lt; s += step, k++) {
    while (seg < m - 1 && S[seg] < s) seg++;
    const s0 = S[seg - 1], s1 = S[seg], t = s1 > s0 ? (s - s0) / (s1 - s0) : 0, dx = X[seg] - X[seg - 1], dy = Y[seg] - Y[seg - 1];
    const x = X[seg - 1] + dx * t, y = Y[seg - 1] + dy * t;
    const env = Math.min(1, 0.3 + s / (w * 2.2)) * Math.min(1, 0.35 + (Lt - s) / (w * 2.8));   // lands light, bears down, lifts off
    const r1 = hash(sd, bf, k * 3 + 11), r2 = hash(sd, bf, k * 3 + 12), r3 = hash(sd, bf, k * 3 + 13);
    const p = press * env * (0.74 + 0.16 * Math.sin(s * 0.045 + wv) + 0.1 * Math.sin(s * 0.19 + wv2));
    if (r1 > 0.38 + p * 0.75) continue;                               // light pressure: only some of the wax catches
    const set = p > 0.62 && r2 < p ? spr.heavy : spr.light, img = set[(r3 * set.length) | 0];
    const sz = w * (0.9 + 0.35 * p) * (0.88 + 0.24 * r2), kk = sz / 32 * 1.3;
    const ang = Math.atan2(dy, dx) + (r1 - .5) * 0.7 + (r3 < 0.5 ? 0 : Math.PI);   // flecks drag along the line
    const ca = Math.cos(ang) * kk, sa = Math.sin(ang) * kk, nx = -Math.sin(ang), ny = Math.cos(ang), off = (r2 - .5) * w * 0.4;
    const px = x + nx * off, py = y + ny * off;
    G.setTransform(a * ca + c * sa, b * ca + d * sa, c * ca - a * sa, d * ca - b * sa, a * px + c * py + e, b * px + d * py + f);
    G.globalAlpha = Math.min(1, 0.5 + 0.5 * p);
    G.drawImage(img, -16, -16);
    if (p > 0.85 && r3 < 0.012) {                                     // a crumb breaks off
      const cx = px + (r1 - .5) * w * 2.4, cy = py + (r2 - .5) * w * 2.4, q = kk * 0.35;
      G.setTransform(a * q, b * q, c * q, d * q, a * cx + c * cy + e, b * cx + d * cy + f); G.drawImage(spr.heavy[k % 10], -16, -16);

}
function pen(pts, o) {

    const ax = pts[i - 1][0], ay = pts[i - 1][1], bx = pts[i][0], by = pts[i][1];
    const d = Math.hypot(bx - ax, by - ay); if (d === 0) continue;

    while (d - pos >= rem) { pos += rem; tot += rem; const t = pos / d; X.push(ax + (bx - ax) * t); Y.push(ay + (by - ay) * t); S.push(tot); rem = step; }

/* ---------- shape helpers (kid imperfections come from R) ---------- */

function rlca8(v){ v&=255; return ((v<<1)|(v>>>7))&255; }
function nextBigBirdSeed(f){
  // Deterministic pseudo-random source: closer to a hardware free-running
  // counter feel than Math.random() changing every frame.
  let s=f.bigSeed&0xFF;
  const fb=((s>>7)^(s>>5)^(s>>4)^(s>>3))&1;
  s=((s<<1)&0xFE)|fb;
  if(s===0) s=0x5D;
  f.bigSeed=s;
  return s;
}
function bigBirdDims(b){
  if(b.kind!=='big') return {w:b.width,h:b.height};
  const w=BIG_BIRD_SHAPE_WIDTH[b.growthState|0] || 56;
  return {w,h:16};
}

/* ---------- helpers ---------- */
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function circleRectHit(cx,cy,cr, rx,ry,rw,rh){
  const nx = clamp(cx, rx, rx+rw), ny = clamp(cy, ry, ry+rh);
  const dx = cx-nx, dy = cy-ny;
  return dx*dx+dy*dy <= cr*cr;
}
function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}
function lerp(a,b,t){ return a+(b-a)*t; }
// Real target-seek from the ROM (L3672/L3695): a bird doesn't wander around
// where it started — it re-centers on the PLAYER's current X each time it
// reaches a target, alternating a "near" leg (toward the player, offset
// short) and a "far" leg (away from the player, offset long), clamped to
// the playfield edges. The previous build picked a random point around a
// fixed home position and never looked at the player at all.
function pickBigBirdTarget(b){
  const playerX = clamp(player.x, 17, LOGICAL_W-17);
  const spread = 10 + (b.col%4)*6;
  if(b.targetSide==='near'){
    b.targetX = clamp(Math.max(b.x, playerX) + spread, 17, LOGICAL_W-17);
    b.targetSide='far';
  } else {
    b.targetX = clamp(Math.min(b.x, playerX) - spread, 17, LOGICAL_W-17);
    b.targetSide='near';
  }
}

const VectorSynth=new Proxy({},{get:(t,k)=>(...a)=>{ if(k!=='init'&&k!=='resume'&&k!=='warmIdle'&&k!=='reset'&&k!=='setMaster') __snd({fn:k,args:a}); }});

// Game integration for the low-cost VectorSynth. The 120 kHz Phoenix
// reference circuit is intentionally absent from this build.
const VECTOR_T3DE0=[
  0x40,0x40,0x40,0x40,0x40,0x40,0x40,0x34,
  0x2C,0x26,0x20,0x1C,0x18,0x14,0x12,0x0F,
  0x0D,0x0B,0x09,0x08,0x07,0x06,0x05,0x04,
  0x03,0x02,0x02,0x02,0x02,0x02,0x02,0x02
];
let vectorSoundMode='none';
let vectorShieldSoundHeld=false;
function setVectorShieldSound(active){
  active=!!active;
  if(active===vectorShieldSoundHeld) return;
  vectorShieldSoundHeld=active;
  VectorSynth.shield(active);
}
function vectorSmallAttackerCount(f){
  if(!f||!f.birds) return 0;
  let n=0;
  for(const b of f.birds) if(b&&b.alive&&b.patternKind!=='base') n++;
  return Math.min(8,n);
}
function stopVectorSynthAmbience(){
  if(vectorSoundMode==='big') VectorSynth.birdWave(null);
  if(vectorSoundMode==='small') VectorSynth.alienAttack(0);
  if(vectorSoundMode==='boss') VectorSynth.mothership(false);
  vectorSoundMode='none';
}
function syncVectorSynthState(force=false){
  if(typeof state==='undefined'||state!=='playing'){
    if(vectorSoundMode!=='none') stopVectorSynthAmbience();
    return;
  }
  let mode='none';
  if(typeof currentBoss!=='undefined'&&currentBoss&&currentBoss.state==='active') mode='boss';
  else if(typeof currentFormation!=='undefined'&&currentFormation) mode=currentFormation.kind||'none';

  if(force||mode!==vectorSoundMode){
    if(vectorSoundMode==='big') VectorSynth.birdWave(null);
    if(vectorSoundMode==='small') VectorSynth.alienAttack(0);
    if(vectorSoundMode==='boss') VectorSynth.mothership(false);
    vectorSoundMode=mode;
    if(mode==='big'&&currentFormation){
      currentFormation.vectorBirdSoundPhase=0;
      currentFormation.vectorBirdSoundTimer=0;
      const idx=Number.isFinite(currentFormation.bigBD6)?(currentFormation.bigBD6&31):0;
      VectorSynth.birdWave(0,VECTOR_T3DE0[idx]);
    }else if(mode==='boss'){
      VectorSynth.mothership('active',vectorSmallAttackerCount(bossEscortFormation));
    }
  }

  if(mode==='small'){
    VectorSynth.alienAttack(vectorSmallAttackerCount(currentFormation));
  }else if(mode==='big'&&currentFormation){
    const f=currentFormation;
    if(!Number.isFinite(f.vectorBirdSoundPhase)) f.vectorBirdSoundPhase=0;
    if(!Number.isFinite(f.vectorBirdSoundTimer)) f.vectorBirdSoundTimer=0;
    const idx=Number.isFinite(f.bigBD6)?(f.bigBD6&31):0;
    const threshold=VECTOR_T3DE0[idx];
    const old=f.vectorBirdSoundTimer&255;
    f.vectorBirdSoundTimer=(f.vectorBirdSoundTimer+1)&255;
    if(old===0) f.vectorBirdSoundPhase=(f.vectorBirdSoundPhase+1)&255;
    else if(threshold<f.vectorBirdSoundTimer) f.vectorBirdSoundTimer=0;
    VectorSynth.birdWave(f.vectorBirdSoundPhase,threshold);
  }else if(mode==='boss'){
    // Mothership timing runs inside VectorSynth; only escort attack intensity changes here.
    VectorSynth.alienAttack(vectorSmallAttackerCount(bossEscortFormation));
  }
}

function buildRomPath(pattern){
  let x=0, y=0, i=0;
  const pts=[[0,0]];
  let guard=0;
  while(i<pattern.length && pattern[i]!==0 && guard++<4096){
    const mv=ROM_MOVE_TABLE[pattern[i]];
    x+=mv[0]; y+=mv[1];
    pts.push([x,y]);
    const gridCoord = mv[1]!==0 ? y : x;
    if((gridCoord & 7)===0) i++;
  }
  return pts;
}

class Bird{
  constructor(kind,col,row,palette){
    this.kind=kind; this.col=col; this.row=row; this.palette=palette;
    this.state='formation';
    this.alive=true;
    this.isEscort=false;
    this.width = kind==='small' ? 16 : 56;
    this.height = kind==='small' ? 8 : 16;
    this.scoreValue = kind==='small' ? 100 : 250;
    this.eggScoreValue = 75;
    this.flapPhase=0;
    this.mouthPhase=0;
    this.x=0; this.y=0; this.angle=0;
    this.renderX=0; this.renderY=0;
    this.prevX=0; this.prevY=0;
    this.diveT=0; this.diveDuration=1.3;
    this.diveStart=null; this.diveC1=null; this.diveC2=null; this.diveEnd=null;
    this.returnFrom=null; this.returnT=0;
    this.fireTimer=1+Math.random();

    if(kind==='small'){
      this.pattern=ROM_BASE_PATTERN;
      this.patternKind='base';
      this.patternStep=0;
      this.tickFromX=0; this.tickFromY=0; this.tickToX=0; this.tickToY=0;
    }

    if(kind==='big'){
      this.wings=[{alive:true,regenT:0},{alive:true,regenT:0}];
      // Waves 3/4 use the 8-byte bird record directly. Formation() overwrites
      // these with the literal T3F80/T3FC0 values.
      this.growthState=1;
      this.screenAddr=0x4800;
      this.phase=0;
      this.timer=0x10;
      this.stepByte=0;
      this.targetX=0;
      this.baseY=0;
    }
  }
}

class Formation{
  constructor(meta, level){
    this.kind=meta.kind; this.rows=meta.rows; this.cols=meta.cols; this.palette=meta.palette;
    this.birdVariant=meta.birdVariant||0;
    this.levelNibble=meta.levelNibble===undefined ? 0x01 : meta.levelNibble;
    this.isMothershipEscort=!!meta.isMothershipEscort;
    this.anchorX=LOGICAL_W/2;
    this.anchorY=57;
    this.t=0;

    // Small-alien engine state.
    this.baseSwayT=0;
    this.baseSwayStepDur=0.16;
    this.basePatternStep=0;
    this.baseClockX=0;
    this.baseClockY=0;
    this.baseAdvancedThisFrame=false;
    this.attackPending=false;
    this.angryPending=false;
    this.angryBaseX=LOGICAL_W/2;
    this.angryBaseY=57;
    this.angryCount=0;
    this.angryTimer=4+Math.random()*3;
    this.angryAnim=null;
    this.spacingX=22;
    this.spacingY=16;
    this.diveCooldown=1.1;
    this.diveTimer=0.9;
    this.attackSequence=0;
    this.smallFrameCounter=0;
    this.smallFrameAccum=0;

    // ROM small-alien behaviour block $4350-$435B / Counter93.
    this.behaviorCounter=0;
    this.behaviorState=0;
    this.nextPattern=null;
    this.attackerCount=1;
    this.leadIndex=0;
    this.attackDelay=0;
    this.startPtrMatch=0;
    this.escalation=0;
    this.angryInterval=0;
    this.groupTimers=[0,0,0];
    this.startPtrRotor=0;

    this.positions = meta.positions || null;
    this.birds=[];

    if(this.kind==='big'){
      // Native bird-wave engine state. These bytes correspond to the ROM's
      // CounterB9 / $4BD1-$4BD7 / $436D-$436F working variables.
      this.bigAccum=0;
      this.bigCounter16=0;
      this.bigCounterB9=0;
      this.bigBD1=0; // turnaround threshold
      this.bigBD2=31; // scroll phase
      this.bigBD3=0; // dwell timer
      this.bigBD4=0; // ascent dither selector
      this.bigBD5=0; // descent speed value
      this.bigBD6=0; // speed-envelope index
      this.bigBD7=0; // active-bird spread
      this.bigSeed=0x5D;
      this.bigCruise=5;
      this.bigSpread=0x40;

      const records=BIG_BIRD_INIT[this.birdVariant] || BIG_BIRD_INIT[3];
      for(let i=0;i<records.length;i++){
        const [shape,addr,phase,timer,x,step,target]=records[i];
        const b=new Bird('big',i,0,this.palette);
        b.growthState=shape;
        b.screenAddr=addr;
        b.phase=phase;
        b.timer=timer;
        b.x=x;
        b.targetX=target;
        b.stepByte=step;
        b.baseY=(addr&0x1F)*8;
        b.y=b.baseY;
        b.prevX=b.renderX=b.x;
        b.prevY=b.renderY=b.y;
        this.birds.push(b);
      }
      return;
    }

    if(this.positions){
      for(let i=0;i<this.positions.length;i++){
        const b=new Bird(this.kind,i,0,this.palette);
        const pos=this.slotPos(i,0);
        b.x=pos.x; b.y=pos.y;
        b.tickFromX=pos.x; b.tickFromY=pos.y; b.tickToX=pos.x; b.tickToY=pos.y;
        this.birds.push(b);
      }
    } else {
      for(let r=0;r<this.rows;r++){
        for(let c=0;c<this.cols;c++){
          this.birds.push(new Bird(this.kind,c,r,this.palette));
        }
      }
    }

    // Visual model is shared across all small-bird waves; only colour varies.
    // The mothership escort is the fifth gameplay wave and deliberately uses
    // the second small-bird wave colour scheme.
    if(this.kind==='small'){
      const visualVariant=(this.isMothershipEscort || this.levelNibble===0x03) ? 1 : 0;
      for(const b of this.birds) b.visualVariant=visualVariant;
    }
  }

  slotPos(col,row){
    if(this.positions){
      const pos=this.positions[col];
      return { x:pos[0], y:pos[1] };
    }
    const totalW=(this.cols-1)*this.spacingX;
    return { x:this.anchorX-totalW/2+col*this.spacingX, y:this.anchorY+row*this.spacingY };
  }
}

function cloneMothershipBody(){
  return MOTHERSHIP_T1D00.slice(0,4).map(r=>r.slice());
}
function makeInitialBeltHalves(){
  const halves=[];
  const row=MOTHERSHIP_T1D00[MOTHERSHIP_BELT_ROW];
  for(let c=MOTHERSHIP_BELT_FIRST_COL;c<MOTHERSHIP_BELT_FIRST_COL+MOTHERSHIP_BELT_TILES;c++){
    const p=row[c]&0x0F;
    halves.push((p>>2)&3, p&3);
  }
  return halves;
}

class Boss{
  constructor(level){
    // b.y is the belt-row centre.  Stage 5 has a fast reveal/entry and then,
    // once live, the whole background object creeps down at roughly one pixel
    // per sixteen 60-Hz frames until its final low position.
    this.x=LOGICAL_W/2;
    this.y=-44;
    this.entryY=82;
    this.stopY=178;
    this.entrySpeed=94;
    this.descentSpeed=60/16; // L24E0: one scroll step every 16 frames
    this.width=160; this.height=72;
    this.state='entering';
    this.t=0;
    this.fireTimer=1.15;
    this.fireSide=0;
    this.pilotAlive=true;

    this.body=cloneMothershipBody();

    // 18 ROM belt tiles = 36 independently destructible 4-pixel half-fields.
    // State 0/2 is solid pattern, 3 is damaged, 1 is the open/pass state.
    this.beltHalves=makeInitialBeltHalves();
    this.beltShift=0;
    this.beltFrame=0;
    this.beltFrameAccum=0;
    this.beltLogicalPeriod=4/60; // L24C4 calls L22FA every fourth video frame
  }
}

const MASTER_VOLUME_STORAGE_KEY='phoenixRebirthMasterVolume';
function clampMasterVolumePercent(v){
  const n=Number(v);
  return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):70;
}
function readMasterVolumePercent(){
  try{
    const saved=localStorage.getItem(MASTER_VOLUME_STORAGE_KEY);
    return saved===null?70:clampMasterVolumePercent(saved);
  }catch(e){ return 70; }
}
function writeMasterVolumePercent(v){
  try{ localStorage.setItem(MASTER_VOLUME_STORAGE_KEY,String(v)); }catch(e){ /* ignore */ }
}
function setMasterVolumePercent(v,persist=true){
  const value=clampMasterVolumePercent(v);
  for(const slider of volumeSliders) slider.value=String(value);
  for(const label of volumeValues) label.textContent=value+'%';
  VectorSynth.setMaster(value/100);
  if(persist) writeMasterVolumePercent(value);
}
for(const slider of volumeSliders){
  slider.addEventListener('input',()=>setMasterVolumePercent(slider.value,true));
}
setMasterVolumePercent(readMasterVolumePercent(),false);

/* ---------- player ----------
   The original animates the ship on alternating "legs" like a walking
   creature rather than a smooth-flying craft (confirmed via ROM sprite
   analysis). The previous build used a generic engine-glow ship silhouette
   with no such animation; this one drives a leg-swing cycle off movement. */
class Player{
  constructor(){
    // Real player ship draws as a "2x2" tile block (16x16 native px, per
    // T1400's 4-byte-per-frame layout) — square, not the 34x26 I had.
    const pSize = 16;
    this.x=PLAYER_START_X; this.y=PLAYER_Y; this.w=pSize; this.h=pSize;
    this.cooldown=0;
    this.shieldState='ready'; // ready | active | cooldown
    this.shieldTimer=0;
    this.lives=START_LIVES; this.invuln=0; this.alive=true;
    this.walkPhase=0;
  }
}
function tryActivateShield(){
  const p=player;
  if(!p || !p.alive || state!=='playing') return;
  if(p.shieldState==='ready'){
    p.shieldState='active';
    p.shieldTimer=SHIELD_ACTIVE_TIME;
    setVectorShieldSound(true);
  }
}

  if(TEST_UNLIMITED_LIVES) return;

    player.lives+=1;

function spawnRound(){
  currentFormation=null; currentBoss=null; bossEscortFormation=null; escortBirds=[];
  bossEscortRespawnTimer=0;
  const meta = ROUND_META[roundIndex];
  const level = cycle + roundIndex*0.25;
  if(meta.kind==='boss'){
    currentBoss=new Boss(level);
    bossEscortFormation=new Formation(MOTHERSHIP_ESCORT_META, level);
  } else {
    currentFormation=new Formation(meta, level);
  }
  if(meta.kind==='small') syncVectorSynthState(true);
  else if(meta.kind==='big') syncVectorSynthState(true);
  else if(meta.kind==='boss') syncVectorSynthState(true);
}
function advanceRound(){
  stopVectorSynthAmbience();
  void 0;
  roundIndex++;
  if(roundIndex>=ROUND_META.length){ roundIndex=0; cycle++; }
  bullets=[];
  state='roundclear';
  transitionTimer=1.6;
  const nextMeta=ROUND_META[roundIndex];
  roundBannerText = nextMeta.kind==='boss' ? 'MOTHERSHIP APPROACHING' : ('ROUND '+cycle+'-'+(roundIndex+1));
}
function checkRoundClear(){
  if(currentFormation && currentFormation.birds.every(b=>!b.alive)){ advanceRound(); }
  if(currentBoss && currentBoss.state==='dead'){ advanceRound(); }
}

/* ---------- player update ---------- */
function updatePlayer(dt){
  const p=player;
  if(!p.alive) return;
  let mv=0;
  const canMove = p.shieldState!=='active'; // shield locks the ship in place
  if(canMove){
    if(keys.has('ArrowLeft')||keys.has('KeyA')||touchState.left) mv-=1;
    if(keys.has('ArrowRight')||keys.has('KeyD')||touchState.right) mv+=1;
  }
  if(mv!==0){
    p.x=clamp(p.x+mv*PLAYER_SPEED*dt, 12, 192);
    p.walkPhase += dt*11;
  } else {
    p.walkPhase += (Math.round(p.walkPhase/Math.PI)*Math.PI - p.walkPhase)*Math.min(1,dt*6);
  }

  if(p.shieldState==='active'){
    p.shieldTimer -= dt;
    if(p.shieldTimer<=0){ p.shieldState='cooldown'; p.shieldTimer=SHIELD_COOLDOWN_TIME; }
  } else if(p.shieldState==='cooldown'){
    p.shieldTimer -= dt;
    if(p.shieldTimer<=0){ p.shieldState='ready'; p.shieldTimer=0; }
  }

  const meta = ROUND_META[roundIndex];
  // The real "faster fire" in round 2 is the extra bullet slot itself (you
  // don't have to wait for your only shot to clear), not a shorter cooldown.
  const maxBullets = (meta && meta.fastFire) ? MAX_PLAYER_BULLETS_FAST : MAX_PLAYER_BULLETS_NORMAL;
  const wantFire = keys.has('Space')||touchState.fire;
  p.cooldown -= dt;
  if(wantFire && p.cooldown<=0){
    const friendlyCount = bullets.filter(b=>b.friendly && !b.dead).length;
    if(friendlyCount<maxBullets){
      bullets.push(new Bullet(p.x, p.y-p.h/2, 0, -BULLET_SPEED, true));
      VectorSynth.playerShot();
      p.cooldown=BULLET_COOLDOWN;
    }
  }
  if(p.invuln>0) p.invuln-=dt;
}
function damagePlayer(){
  const p=player;
  if(p.invuln>0 || !p.alive) return;
  if(!TEST_UNLIMITED_LIVES) p.lives-=1;
  VectorSynth.explosion('player');
  spawnBurst(p.x,p.y,'#39d6ff',22);
  if(!TEST_UNLIMITED_LIVES && p.lives<=0){
    p.alive=false;
    triggerGameOver();
  } else {
    p.invuln=2.2;
    p.x=PLAYER_START_X;
  }
}
function triggerGameOver(){
  state='gameover';
  stopVectorSynthAmbience();
  VectorSynth.explosion('player');
  writeHighScore(Math.max(score,highScore));
  highScore=Math.max(score,highScore);
  finalScoreEl.textContent=String(score).padStart(6,'0');
  finalHiEl.textContent=String(highScore).padStart(6,'0');
  if(finalDifficultyEl) finalDifficultyEl.textContent=difficultyConfig().label;
  gameoverScreen.classList.add('show');
}

/* ---------- bullets ---------- */
function updateBullets(dt){
  for(const b of bullets){
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.y<-10||b.y>LOGICAL_H+10||b.x<-10||b.x>LOGICAL_W+10) b.dead=true;
  }
  bullets = bullets.filter(b=>!b.dead);
}

/* ---------- particles / stars / popups ---------- */
function spawnBurst(x,y,color,n){ for(let i=0;i<n;i++) particles.push(new Particle(x,y,color,'spark')); }
function spawnEmber(x,y,color){
  const p=new Particle(x,y,color,'spark');
  p.vx*=0.15; p.vy=9+Math.random()*13; // drifts slowly downward, like a falling ember
  p.life=0.5+Math.random()*0.3; p.maxLife=p.life;
  p.size=0.45+Math.random()*0.7;
  particles.push(p);
}
function spawnFeatherCloud(x,y,colors,n,opts={}){
  const palette=Array.isArray(colors)&&colors.length ? colors : [colors||'#ffffff'];
  const spread=opts.spread===undefined ? Math.PI*2 : opts.spread;
  const angleBase=opts.angleBase===undefined ? -Math.PI/2 : opts.angleBase;
  for(let i=0;i<n;i++){
    const angle=spread>=Math.PI*1.99
      ? Math.random()*Math.PI*2
      : angleBase + (Math.random()-0.5)*spread;
    const speed=(opts.speedMin===undefined ? 26 : opts.speedMin) + Math.random()*((opts.speedMax===undefined ? 68 : opts.speedMax)-(opts.speedMin===undefined ? 26 : opts.speedMin));
    const color=palette[(Math.random()*palette.length)|0];
    particles.push(new Particle(x+(Math.random()-0.5)*2.5,y+(Math.random()-0.5)*2.5,color,'feather',{angle,speed}));
  }
}
function spawnEggShellPieces(x,y,rx,ry,n,opts={}){
  for(let i=0;i<n;i++){
    // Start on the visible shell rather than at its centre, then let gravity
    // pull the chip away. Keep every fragment as a thin white vector stroke.
    const a=(opts.finalHatch ? (-1.15+Math.random()*2.30) : (Math.random()*Math.PI*2));
    const sx=x+Math.sin(a)*rx*(0.72+Math.random()*0.22);
    const sy=y-Math.cos(a)*ry*(0.72+Math.random()*0.22);
    let side=Math.sign(Math.sin(a));
    if(!side) side=Math.random()<0.5?-1:1;
    const p=new Particle(sx,sy,'#ffffff','shell',{side,speed:(opts.speedMin||9)+Math.random()*((opts.speedMax||25)-(opts.speedMin||9))});
    particles.push(p);
  }
}
function shedEggShellForTransition(b,fromState,toState){
  if(fromState<1 || fromState>=5 || toState===fromState) return;
  const t=(clamp(fromState,1,4)-1)/3;
  const rx=3.6+t*4.6, ry=5.0+t*5.4;
  const count=toState>=5 ? 7 : (toState===4 ? 3 : (toState===3 ? 2 : 1));
  spawnEggShellPieces(b.renderX,b.renderY,rx,ry,count,{finalHatch:toState>=5,speedMin:toState>=5?12:8,speedMax:toState>=5?28:20});
}
function updateParticles(dt){
  for(const p of particles){
    p.life-=dt;
    p.age=p.maxLife>0 ? 1-clamp(p.life/p.maxLife,0,1) : 1;
    if(p.kind==='feather'){
      p.flutterPhase+=dt*p.flutterSpeed;
      if(p.age<p.burstHold){
        p.vx*=0.995;
        p.vy*=0.995;
      }else{
        p.vy+=p.gravity*dt;
        p.vx+=Math.sin(p.flutterPhase)*p.flutterForce*dt;
        p.vx*=p.drag;
        p.vy*=0.996;
      }
      p.rot+=p.rotSpeed*dt + Math.sin(p.flutterPhase*0.7)*0.03;
      p.rotSpeed*=p.spinDamp;
      p.x+=(p.vx + Math.sin(p.flutterPhase)*p.flutterDrift)*dt;
      p.y+=p.vy*dt;
    }else if(p.kind==='shell'){
      p.vy+=p.gravity*dt;
      p.vx*=p.drag;
      p.vy*=0.997;
      p.rot+=p.rotSpeed*dt;
      p.rotSpeed*=0.992;
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
    }else{
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94;
    }
  }
  particles = particles.filter(p=>p.life>0);
}
function updateStars(dt){}
function updatePopups(dt){ for(const p of popups){ p.life-=dt; p.y-=12*dt; } popups=popups.filter(p=>p.life>0); }
function updateAmbient(dt){ updateParticles(dt); updateStars(dt); updatePopups(dt); }

/* ---------- formation / dives ---------- */
function startDive(b,f){
  const slot=f.slotPos(b.col,b.row);
  const S={x:slot.x,y:slot.y};
  const patternIdx = Math.floor(Math.random()*ROM_PATTERNS.length);
  const mirror = Math.random()<0.5 ? -1 : 1; // free extra variant, real hardware technique
  b.diveStart=S;
  b.divePattern=ROM_PATTERNS[patternIdx];
  b.diveMirror=mirror;
  b.diveDuration = Math.max(0.9,(b.kind==='small'?1.3:1.7) - Math.min(cycle,10)*0.02);
  b.diveT=0;
  b.fireTimer=0.5+Math.random()*0.7;
  b.state='diving';
}
function updateFormation(dt){
  const f=currentFormation;
  f.t+=dt;
  if(f.kind==='small'){
    updateSmallFormation(f,dt);
    return;
  }
  updateBigFormation(f,dt);
}

// Waves 3/4 run a 60 Hz byte-state machine just as the hardware did.
// Rendering is interpolated between those ticks, so the vectors remain smooth
// without changing the old movement timing.
function updateBigFormation(f,dt){
  const tick=1/60;
  f.bigAccum+=dt;
  let guard=0;
  while(f.bigAccum>=tick && guard<8){
    for(const b of f.birds){
      b.prevX=b.x; b.prevY=b.y;
    }
    stepBigBirdFrame(f);
    f.bigAccum-=tick;
    guard++;
  }

  const a=clamp(f.bigAccum/tick,0,1);
  for(const b of f.birds){
    if(!b.alive) continue;
    b.renderX=lerp(b.prevX,b.x,a);
    // Do not interpolate through the whole screen when scroll RAM wraps.
    b.renderY=Math.abs(b.y-b.prevY)>128 ? b.y : lerp(b.prevY,b.y,a);
    b.flapPhase += dt*(4.5 + ((b.stepByte||0)&15)*0.45);
    b.mouthPhase += dt*3.2;
    for(const w of b.wings){
      if(!w.alive){
        w.regenT-=dt;
        if(w.regenT<=0) w.alive=true;
      }
    }
  }
}

function stepBigBirdFrame(f){
  f.bigCounter16=(f.bigCounter16+1)&0xFFFF;
  const lo=f.bigCounter16&0xFF;
  const hi=(f.bigCounter16>>>8)&0xFF;
  const aliveCount=f.birds.reduce((n,b)=>n+(b.alive?1:0),0);

  // L3560 calls GetRandomNumber every frame.  The ROM source is
  // ((Counter9A+1 rotated left 3) & 7 + PlayerShipX) & 0x0F.
  const rnd=(((lo>>>5)&7)+(player.x|0))&0x0F;
  f.bigSeed=((rnd<<4)|rnd)&0xFF;
  const roundGroup=Math.min(Math.max(cycle-1,0),3);
  const birdBucket=Math.min(Math.max(aliveCount-1,0),3);
  const timingHalf=((hi<<2)&0x20)?1:0;
  const launchIndex=timingHalf*16 + roundGroup*4 + birdBucket;
  const launch=BIG_BIRD_LAUNCH[launchIndex];
  f.bigCruise=launch[0];
  f.bigSpread=(launch[1]+(rnd<<2))&0xF8;

  stepBigVertical(f,aliveCount,lo,hi);

  // With four or more survivors the ROM updates one half of the eight records
  // per frame; below four it updates both halves each frame.
  let first=0,last=8;
  if(aliveCount>=4){
    if(lo&1){ first=4; last=8; }
    else { first=0; last=4; }
  }
  for(let i=first;i<last;i++){
    const b=f.birds[i];
    if(!b.alive) continue;
    stepBigBirdRecord(b,f);
  }

  // Apply hardware scroll to every record, including the half not horizontally
  // updated this frame. CounterB9 decreasing means the formation moves down.
  const scroll=(-f.bigCounterB9)&0xFF;
  for(const b of f.birds){
    if(!b.alive) continue;
    b.y=(b.baseY+scroll)&0xFF;
  }

  stepBigBirdBombs(f,aliveCount,lo);
}

function stepBigVertical(f,aliveCount,lo,hi){
  // L2600 computes this from the *pre-move* scroll counter.
  f.bigBD2=((~f.bigCounterB9)>>>3)&0x1F;

  if(f.bigBD1 < f.bigBD3){
    // L2650: slow upward return uses the same dither table, selected by BD4.
    const idx=((lo<<2)&0x0C) + (f.bigBD4&3);
    f.bigCounterB9=(f.bigCounterB9 + BIG_BIRD_DITHER[idx])&0xFF;
  } else {
    // Descent: coarse BD5 speed plus a fractional 0/1 dither.
    const d=f.bigBD5&0xFF;
    const idx=((lo<<2)&0x0C) + (d&3);
    const step=((d>>>2)&7) + BIG_BIRD_DITHER[idx];
    f.bigCounterB9=(f.bigCounterB9-step)&0xFF;
  }

  if((lo&1)===0){
    recomputeBigBirdSpread(f);
  } else {
    recomputeBigBirdVerticalSpeed(f,aliveCount,hi);
    tickBigBirdDwell(f,aliveCount,hi);
  }
}

function recomputeBigBirdSpread(f){
  // L26D0 scans bird 7 -> bird 0. D/E become the first/last surviving
  // positions in that reverse scan, not geometric screen coordinates.
  let first=null,last=null;
  for(let scan=0;scan<8;scan++){
    const birdIndex=7-scan;
    if(f.birds[birdIndex] && f.birds[birdIndex].alive){
      if(first===null) first=scan;
      last=scan;
    }
  }
  if(first===null){ first=0; last=0; }
  f.bigBD6=(f.bigBD2+first+last)&0x1F;
  f.bigBD7=(last-first)&0xFF;
}

function recomputeBigBirdVerticalSpeed(f,aliveCount,hi){
  let candidate=f.bigCruise;
  if(hi>=0x18) candidate++;
  if(hi>=0x10) candidate++;
  // AliensLeft is zero on bird waves, so the ROM's <3 test always adds one.
  candidate++;
  let speed=Math.min(candidate,BIG_BIRD_SPEED_CAP[f.bigBD6&0x1F]);
  if(aliveCount<4) speed++;
  if(aliveCount<2) speed++;
  f.bigBD5=speed&0xFF;
}

function tickBigBirdDwell(f,aliveCount,hi){
  const old=f.bigBD3&0xFF;
  f.bigBD3=(old-1)&0xFF;
  if(old!==0) return;

  // L26AA cancels the underflow and only re-arms while the active-band
  // centre is in the launch window 8..21.
  f.bigBD3=(f.bigBD3+1)&0xFF;
  const a=f.bigBD6&0xFF;
  if(a<0x08 || a>=0x16) return;

  const B=rlca8((a-f.bigBD7)&0xFF);
  f.bigBD4=f.bigSeed&3;
  const C=((~f.bigBD4)&3)+1;
  rearmBigBirdCycle(f,B,C,aliveCount,hi);
}

function rearmBigBirdCycle(f,B,C,aliveCount,hi){
  // L2495's tiny unrolled multiply.
  let a=(B+C)&0xFF;
  let c=C;
  a=(a+B)&0xFF; c--; if(c===0){ f.bigBD3=a; }
  else {
    a=(a+B)&0xFF; c--; if(c===0){ f.bigBD3=a; }
    else {
      a=(a+B)&0xFF; c--; 
      f.bigBD3 = c===0 ? a : ((a<<1)&0xFF);
    }
  }

  const killed=8-aliveCount;
  let t=rlca8(killed);     // 2*(8-BirdsLeft)
  t=(t+hi)&0xFF;           // + Counter9A (high byte)
  t=rlca8(t);              // and *2 again
  f.bigBD1=((f.bigSeed&0x1E)+t)&0xFF;
}

function stepBigBirdRecord(b,f){
  const oldGrowthState=b.growthState|0;
  const desc=BIG_BIRD_STATE[b.growthState] || BIG_BIRD_STATE[13];

  if(b.timer>0) b.timer=(b.timer-1)&0xFF;

  if(desc.move) moveBigBirdHorizontal(b,f);
  else if((b.timer&1)===0) b.phase=(b.phase+1)&7; // L36C0

  if(desc.transition==='terminal') return;
  if(b.timer!==0) return;

  const stopped=((b.stepByte&0x0F)===0);
  if((desc.transition==='gated' || desc.transition==='branch') && !stopped) return;

  b.timer=desc.B&0xFF;
  b.growthState=desc.D&0x0F;

  if(desc.transition==='branch'){
    // L370A keeps the default when the masked high nibble is non-zero;
    // otherwise it follows the alternate state/timer packed into C/E.
    if(((f.bigSeed & desc.E)&0xF0)===0){
      b.growthState=desc.E&0x0F;
      b.timer=desc.C&0xFF;
    }
  }
  if(oldGrowthState<5 && (b.growthState|0)!==oldGrowthState){
    shedEggShellForTransition(b,oldGrowthState,b.growthState|0);
  }
}

function moveBigBirdHorizontal(b,f){
  let step=b.stepByte&0xFF;
  if(step>=0x10){
    moveBigBirdReverse(b,f);
    return;
  }

  const oldStep=step;
  b.x=(b.x+step)&0xFF;
  b.phase+=step;
  if(b.phase<8){
    if(oldStep===0) b.stepByte=(b.stepByte+1)&0xFF; // L366A
    return;
  }

  b.phase&=7;
  b.screenAddr=(b.screenAddr-0x20)&0xFFFF;

  const current=b.x&0xFF;
  const target=b.targetX&0xFF;
  b.stepByte=0x10; // provisional reverse/stall
  const diff=(target-current)&0xFF;
  if(diff===0){
    chooseBigBirdNearTarget(b,f);
    return;
  }

  const candidate=((((diff-1)&0xFF)>>>3)&0x1F)+1;
  if(candidate<oldStep){
    b.stepByte=candidate&0x0F;
  } else {
    b.stepByte=f.bigCruise&0x0F;
    if((f.bigCruise&0x0F)!==oldStep) b.stepByte=(oldStep+1)&0x0F;
  }
}

function moveBigBirdReverse(b,f){
  let mag=b.stepByte&0x0F;
  if(mag===0){
    // L3744: the reverse-direction zero-step kick-start.
    b.stepByte=0x11;
    b.x=(b.x-1)&0xFF;
    b.phase=7;
    b.screenAddr=(b.screenAddr+0x20)&0xFFFF;
    return;
  }

  const oldStep=mag;
  b.x=(b.x-mag)&0xFF;
  b.phase-=mag;

  if(b.phase>=0){
    if((b.targetX&0xFF)===(b.x&0xFF)){
      b.stepByte=0;
      chooseBigBirdFarTarget(b,f);
    }
    return;
  }

  b.phase&=7;
  b.screenAddr=(b.screenAddr+0x20)&0xFFFF;

  const diff=((b.x&0xFF)-(b.targetX&0xFF))&0xFF;
  const candidate=((diff>>>3)&0x1F)+1;
  let newMag;
  if(candidate<oldStep) newMag=candidate;
  else if((f.bigCruise&0x0F)===oldStep) newMag=f.bigCruise&0x0F;
  else newMag=(oldStep+1)&0x0F;
  b.stepByte=0x10|(newMag&0x0F);
}

function chooseBigBirdNearTarget(b,f){
  const playerX=(player.x|0)&0xF8;
  const here=b.x&0xFF;
  const anchor=Math.min(here,playerX);
  const spread=f.bigSpread&0xFF;
  f.bigSpread=(spread+8)&0xFF;
  const value=anchor-spread;
  b.targetX=(value<8)?8:(value&0xFF);
}

function chooseBigBirdFarTarget(b,f){
  const playerX=(player.x|0)&0xF8;
  const here=b.x&0xFF;
  const anchor=Math.max(here,playerX);
  const spread=f.bigSpread&0xFF;
  f.bigSpread=(spread+8)&0xFF;
  const value=anchor+spread;
  b.targetX=(value>=0xC8)?0xC8:(value&0xFF);
}

function stepBigBirdBombs(f,aliveCount,lo){
  // L3A00: only frames with Counter9A+1 bit 1 set perform the scan.
  if((lo&0x02)===0 || aliveCount===0) return;

  const phase=f.bigBD2&0x1E;
  const [count,start]=BIG_BIRD_ACTIVE_WINDOW[(phase>>>1)&15];
  const danger=12-aliveCount; // exact D = $0C - BirdsLeft
  const left=player.x-player.w/2-danger;
  const right=player.x+player.w/2+danger;

  // L25B7: 3 enemy-bullet slots in round 0, 4 in round 1, 5 thereafter.
  const maxEnemyBullets=cycle<=1?3:(cycle===2?4:5);

  for(let n=0;n<count;n++){
    const b=f.birds[start+n];
    if(!b || !b.alive || b.growthState<5) continue;
    if(b.x<left || b.x>=right) continue;

    const used=bullets.reduce((sum,bb)=>sum+(!bb.friendly&&!bb.dead?1:0),0);
    if(used>=maxEnemyBullets) return;

    // L395C computes C = ((BD2 + record+2) & 31)*8 + 8;
    // L25B7 then adds +4 to X and +12 to Y.  Since L395C first did X-4,
    // the final bomb X is exactly the bird's grid X.
    const row=((f.bigBD2 + (b.screenAddr&0xFF))&0x1F);
    const bombX=b.x&0xFF;
    const bombY=((row<<3)+20)&0xFF;
    bullets.push(new Bullet(bombX,bombY,0,ENEMY_BULLET_SPEED,false));
    void 0;
    // Do NOT break: the ROM continues scanning the active birds and may fill
    // several free bullet slots on the same permitted frame.
  }
}

/* Unified small-bird movement.
   The simulation keeps the ROM's byte-sized coordinates and pattern interpreter,
   while rendering interpolates between those discrete positions. The base T1000
   formation pointer is treated as a shared clock, matching the original code. */
function lerpByte(a,b,t){
  let d=((b-a+128)&255)-128;
  return a+d*t;
}
function applyRomMove(b, opcode){
  const mv=ROM_MOVE_TABLE[opcode];
  if(!mv) return false;
  b.tickFromX=b.tickToX & 0xFF;
  b.tickFromY=b.tickToY & 0xFF;
  const dx=mv[0], dy=mv[1];
  b.tickToX=(b.tickFromX+dx)&0xFF;
  b.tickToY=(b.tickFromY+dy)&0xFF;
  // Retain the current ROM movement vector for rendering only.  This does not
  // alter movement; it lets the visual layer distinguish the other game's
  // fixed dive pose from its normal flying/flapping pose.
  b.visualMoveDX=dx;
  b.visualMoveDY=dy;
  if(dx!==0 || dy!==0) b.angle=Math.atan2(dy,dx);
  return true;
}
function assignAlienPattern(b, pattern, kind='attack'){
  b.pattern=pattern;
  b.patternKind=kind;
  b.patternStep=0;
  b.state = kind==='attack' ? 'diving' : 'formation';
  b.tickFromX=b.tickToX & 0xFF;
  b.tickFromY=b.tickToY & 0xFF;
}
function finishAlienPattern(b,f){
  b.pattern=ROM_BASE_PATTERN;
  b.patternKind='base';
  b.patternStep=f.basePatternStep;
  b.state='formation';
}
function stepAttackBird(b,f){
  if(!b.pattern || b.pattern[b.patternStep]===0){
    finishAlienPattern(b,f);
    return;
  }
  const opcode=b.pattern[b.patternStep];
  if(!applyRomMove(b,opcode)){
    finishAlienPattern(b,f);
    return;
  }
  const mv=ROM_MOVE_TABLE[opcode];
  // L0D54/L0D62: Y controls pointer advancement when Y moves, otherwise X.
  const gridCoord = mv[1]!==0 ? b.tickToY : b.tickToX;
  if((gridCoord & 7)===0){
    b.patternStep++;
    if(b.pattern[b.patternStep]===0) finishAlienPattern(b,f);
  }
}
function stepBaseBird(b,opcode){
  applyRomMove(b,opcode);
}
function advanceBaseClock(f,opcode){
  const mv=ROM_MOVE_TABLE[opcode];
  if(!mv) return false;
  f.baseClockX=(f.baseClockX+mv[0])&0xFF;
  f.baseClockY=(f.baseClockY+mv[1])&0xFF;
  const gridCoord = mv[1]!==0 ? f.baseClockY : f.baseClockX;
  if((gridCoord&7)===0){
    f.basePatternStep=(f.basePatternStep+1)%16;
    return true;
  }
  return false;
}
function rrc8(v,n=1){
  v&=0xFF;
  while(n-->0) v=((v>>>1)|((v&1)<<7))&0xFF;
  return v;
}
function smallLevelAndRound(f){
  // Live small-alien stages are 1,3 and B in the low nibble; the high nibble
  // is the completed game-cycle count.
  return ((((cycle-1)&0x0F)<<4) | (f.levelNibble&0x0F)) & 0xFF;
}
function smallRomRandom(f){
  // GetRandomNumber $30AA: ((Counter9A+1 RLC 3)&7 + PlayerShipX) & 0x0F.
  // RLC3 then AND 7 is the original high three bits of the counter byte.
  const ctr=f.smallFrameCounter&0xFF;
  return (((ctr>>>5)&7) + ((player.x|0)&0xFF)) & 0x0F;
}
function romAttackPhase(y,attackerCount,f){
  if(attackerCount!==1) return f.escalation&3;
  y&=0xFF;
  if(y<0x58) return 0;
  if(y<0x78) return 1;
  if(y<0x98) return 2;
  return 3;
}
function selectRomAttackPattern(lead,attackerCount,f){
  const ax=lead.tickToX&0xFF;
  const px=(Math.round(player.x)&0xFF);
  let sideOffset=4, dist;
  if(px>=ax) dist=(px-ax)&0xFF;
  else { dist=(ax-px)&0xFF; sideOffset=0; }
  const bucket=(dist>>>5)&7;
  const group=ROM_T3300[bucket];
  const phase=romAttackPhase(lead.tickToY,attackerCount,f);
  const baseOffset=ROM_T3310[(group+sideOffset)*4+phase];
  const pairOffset=smallRomRandom(f)&0x06;
  const pointerIndex=((baseOffset-0x30+pairOffset)>>1);
  const address=ROM_T3330_POINTERS[pointerIndex];
  return ROM_ATTACK_PATTERNS[address] || ROM_ATTACK_PATTERNS[0x1020];
}
function romScaledMagnitude(f,aliveCount){
  const lr=smallLevelAndRound(f);
  const roundSel=rrc8(lr,1)&7;
  let c=(7-roundSel)&0xFF;
  let a=lr;
  if(a>=0x80) a=0x70;
  const levelSel=rrc8(a,4)&7;
  c=(c+(7-levelSel))&0xFF;
  c=(c+(aliveCount>=5?(aliveCount-5):0x10))&0xFF;
  c=(c+(smallRomRandom(f)&7))&0xFF;
  return c;
}
function romReloadAttackDelay(f,aliveCount){
  let c=romScaledMagnitude(f,aliveCount);
  let a=f.smallFrameCounter&0xFF;
  if(a>=0x10) a=0x0F;
  c=((0x0F-a)+c)&0xFF;
  let b=1;
  for(let i=0;i<3;i++){
    if(f.groupTimers[i]!==0) continue;
    c=rrc8(c,1)&0x7F;
    if(b!==0){ b--; f.groupTimers[i]=0x0C; }
  }
  f.attackDelay=((rrc8(rrc8(c,1),1)&0x3F)+1)&0xFF;
}
function romChooseAttackerCount(f){
  const lr=smallLevelAndRound(f);
  let threshold=(rrc8(lr,2)&0x0F)+5;
  if(threshold>=0x11) threshold=5;
  threshold=(threshold-f.escalation)&0xFF;
  const r=(smallRomRandom(f)+1)&0xFF;
  f.attackerCount=r<threshold?r:1;
}
function romPickLeadAlien(f){
  const n=f.birds.length;
  if(!n) return false;
  const start=smallRomRandom(f)%n;
  for(let k=0;k<n;k++){
    const i=(start+k)%n;
    const b=f.birds[i];
    if(!b.alive||b.patternKind!=='base') continue;
    if((f.basePatternStep&15)!==(f.startPtrMatch&15)) continue;
    f.leadIndex=i;
    f.behaviorState=3;
    return true;
  }
  return false;
}
function romPrepareSwoop(f){
  if(f.behaviorState!==3) return;
  const lead=f.birds[f.leadIndex];
  if(!lead||!lead.alive) return;
  f.nextPattern=selectRomAttackPattern(lead,f.attackerCount,f);
  f.behaviorState=5;
}
function romInstallPreparedPattern(f){
  f.startPtrMatch=f.startPtrRotor&15;
  f.startPtrRotor=(f.startPtrRotor+1)&15;
  if(f.behaviorState<5) return;
  const pattern=f.nextPattern;
  const count=Math.min(f.attackerCount|0,difficultyConfig().maxAttackers);
  const lead=f.leadIndex|0;
  f.behaviorState=0;
  if(!pattern||count<=0) return;
  let launched=0;
  const n=f.birds.length;
  for(let k=0;k<n&&launched<count;k++){
    const b=f.birds[(lead+k)%n];
    if(!b.alive||b.patternKind!=='base') continue;
    if((f.basePatternStep&15)!==(f.startPtrMatch&15)) continue;
    const kind=(pattern===ROM_ANGRY_PATTERNS[0]||pattern===ROM_ANGRY_PATTERNS[1])?'angry':'attack';
    assignAlienPattern(b,pattern,kind);
    launched++;
  }
}
function romAngrySubtask(f,aliveCount){
  if(f.escalation>=3||f.behaviorState>=4) return;
  if(f.angryInterval===0){
    f.angryInterval=((f.escalation<<2)+romScaledMagnitude(f,aliveCount)+7)&0xFF;
    return;
  }
  f.angryInterval=(f.angryInterval-1)&0xFF;
  if(f.angryInterval!==0) return;
  f.escalation=(f.escalation+1)&0xFF;
  f.angryCount=f.escalation;
  f.behaviorState=4;
  f.attackerCount=0x10;
  f.leadIndex=0;
  f.nextPattern=(Math.round(player.x)&1)?ROM_ANGRY_PATTERNS[0]:ROM_ANGRY_PATTERNS[1];
}
function romAttackDelaySubtask(f,aliveCount){
  for(let i=0;i<3;i++) if(f.groupTimers[i]>0) f.groupTimers[i]--;
  if(f.behaviorState!==0) return;
  if(f.attackDelay===0){ romReloadAttackDelay(f,aliveCount); return; }
  f.attackDelay--;
  if(f.attackDelay===0) f.behaviorState=1;
}
function romConfirmAngryStart(f){
  if(f.behaviorState!==4) return;
  for(const b of f.birds){
    if(!b.alive) continue;
    if(b.patternKind!=='base') return;
    if((f.basePatternStep&15)!==(f.startPtrMatch&15)) return;
  }
  f.behaviorState=6;
}
function stepAlienBehaviorScheduler(f,aliveCount){
  const phase=f.behaviorCounter&7;
  f.behaviorCounter=(f.behaviorCounter+1)&0xFF;
  switch(phase){
    case 0: romInstallPreparedPattern(f); break;
    case 1: romAngrySubtask(f,aliveCount); break;
    case 2: romAttackDelaySubtask(f,aliveCount); break;
    case 3: if(f.behaviorState===1){ f.behaviorState=2; romChooseAttackerCount(f); } break;
    case 4: if(f.behaviorState===2) romPickLeadAlien(f); break;
    case 5: romPrepareSwoop(f); break;
    case 6: romConfirmAngryStart(f); break;
    case 7: break;
  }
}
function smallEnemyBulletLimit(){ return cycle<=1?3:(cycle===2?4:5); }
function trySmallAlienBombDrop(f){
  const liveBullets=bullets.reduce((n,b)=>n+(!b.friendly&&!b.dead?1:0),0);
  if(liveBullets>=smallEnemyBulletLimit()) return;
  const start=(f.behaviorCounter&1)?8:0;
  const end=Math.min(start+8,f.birds.length);
  const depth=((f.escalation<<3)+0xAD)&0xFF;
  const left=(player.x-player.w/2)-10;
  const right=(player.x+player.w/2)+3;
  for(let i=start;i<end;i++){
    const b=f.birds[i];
    if(!b.alive) continue;
    const x=b.tickToX&0xFF, y=b.tickToY&0xFF;
    if(x<left||x>=right) continue;
    if(y<0x80||y>=depth) continue;
    bullets.push(new Bullet(x,y,0,ENEMY_BULLET_SPEED+Math.min(cycle,10)*3.5,false));
    void 0;
    return;
  }
}
function stepSmallBirds(f){
  const baseOpcode=ROM_BASE_PATTERN[f.basePatternStep];
  for(const b of f.birds){
    if(!b.alive) continue;
    if(b.patternKind==='base') stepBaseBird(b,baseOpcode);
    else stepAttackBird(b,f);
  }
  if(advanceBaseClock(f,baseOpcode)) f.baseAdvancedThisFrame=true;
}
function updateSmallFormation(f,dt){
  f.smallFrameAccum+=dt;
  while(f.smallFrameAccum>=1/60){
    f.smallFrameAccum-=1/60;
    f.smallFrameCounter=(f.smallFrameCounter+1)&0xFF;
  }
  const aliveCount=f.birds.reduce((n,b)=>n+(b.alive?1:0),0);
  const tickInterval=aliveCount<5?(2/60):(4/60);
  f.tickTimer=(f.tickTimer||0)+dt;
  f.baseAdvancedThisFrame=false;
  while(f.tickTimer>=tickInterval){
    f.tickTimer-=tickInterval;
    stepAlienBehaviorScheduler(f,aliveCount);
    stepSmallBirds(f);
    trySmallAlienBombDrop(f);
  }
  const frac=clamp(f.tickTimer/tickInterval,0,1);
  for(const b of f.birds){
    if(!b.alive) continue;
    b.x=lerpByte(b.tickFromX,b.tickToX,frac);
    b.y=lerpByte(b.tickFromY,b.tickToY,frac);
    b.flapPhase+=dt*(b.patternKind==='base'?6:10);
  }
}

/* Hit rule fix: a small bird always dies in one hit. A big bird's BODY is
   what must be hit to kill it, regardless of wing state — "shooting large
   birds in the wings only removes the wings... shots hitting a wing remove
   it temporarily... [birds] must be struck in the center to be destroyed."
   The previous build required both wings gone before the body was
   vulnerable, which is backwards. */
function hitBird(bird,bullet){
  if(bird.kind==='small'){
    killBirdBody(bird, bird.state==='diving' ? 2.5 : 1);
    return;
  }

  const dims=bigBirdDims(bird);
  // The early hatch/growth shapes do not yet have the adult detachable-wing
  // geometry. Treat a hit on those compact shapes as a body hit.
  if((bird.growthState|0)<5){
    killBirdBody(bird,1);
    return;
  }

  const centerHalf=dims.w*0.26;
  const dx=bullet.x-bird.x;
  if(Math.abs(dx)<=centerHalf){
    killBirdBody(bird,1);
  } else {
    const side=dx<0?0:1;
    const w=bird.wings[side];
    if(w.alive){
      w.alive=false;
      w.regenT=5+Math.random()*2;
      VectorSynth.wingHit();
      spawnBurst(bird.x+(side===0?-dims.w/2:dims.w/2),bird.y,bird.palette[1],6);
      addScore(20);
      spawnPopup(bird.x,bird.y,'+20');
    } else {
      spawnBurst(bullet.x,bullet.y,'#ffffff',2);
    }
  }
}
function killBirdBody(bird, bonusMult){
  if(!bird.alive) return;
  bonusMult = bonusMult||1;
  bird.alive=false;
  const val = Math.round(bird.scoreValue*bonusMult);
  addScore(val);
  spawnPopup(bird.x,bird.y,'+'+val);
  spawnFeatherCloud(bird.x,bird.y,birdFeatherColors(bird), bird.kind==='small'?16:24);
  spawnBurst(bird.x,bird.y,bird.palette[0],3);
  VectorSynth.bonusKill();
}

/* ---------- mothership escorts ---------- */
/* ---------- boss ----------
   Escort birds ("small phoenixes" from the early stages) attack alongside
   the mothership in the original; the previous build fought it 1-on-1. */
function fireBossBullet(boss){
  const side = boss.fireSide ? 1 : -1;
  boss.fireSide ^= 1;
  const originX = boss.x + side*boss.width*0.31;
  const originY = boss.y + boss.height*0.08;
  const dx=player.x-originX, dy=player.y-originY;
  const d=Math.hypot(dx,dy)||1;
  const speed=ENEMY_BULLET_SPEED+Math.min(cycle,10)*3.1;
  bullets.push(new Bullet(originX,originY, dx/d*speed, dy/d*speed, false));
  void 0;
}
function bossWrapIdx(v,len){ return ((v%len)+len)%len; }
function bossTileTopY(sourceRow){ return (4-sourceRow)*MOTHERSHIP_TILE - MOTHERSHIP_TILE/2; }
function bossTileLeftX(col){ return MOTHERSHIP_X0 + col*MOTHERSHIP_TILE; }
function bossBeltLeft(){ return bossTileLeftX(MOTHERSHIP_BELT_FIRST_COL); }
function bossBeltHalfW(){ return MOTHERSHIP_TILE/2; }
function bossBeltVisualShift(b){
  // Tween the half-field travel between the exact 15 Hz logical belt shifts.
  return b.beltShift + clamp(b.beltFrameAccum/b.beltLogicalPeriod,0,1);
}
function bossBeltSourceAtX(b, worldX){
  const localX=worldX-b.x;
  const left=bossBeltLeft();
  const halfW=bossBeltHalfW();
  if(localX<left || localX>=left+MOTHERSHIP_BELT_TILES*MOTHERSHIP_TILE) return null;
  const screenHalf=Math.floor((localX-left)/halfW);
  const source=bossWrapIdx(screenHalf-b.beltShift,b.beltHalves.length);
  return {screenHalf,source,state:b.beltHalves[source]};
}
function bossDamageBeltHalf(state){
  // Exact T1B40/T1B50 half-field progression: 0/2 -> 3 -> 1(open).
  if(state===1) return 1;
  if(state===3) return 1;
  return 3;
}
function bossIsPilotHalf(worldX){
  const localX=worldX-LOGICAL_W/2;
  const left=bossTileLeftX(12);
  const right=bossTileLeftX(14);
  return localX>=left && localX<right;
}
function bossBodyCellAtBullet(b,bul){
  const lx=bul.x-b.x;
  const ly=bul.y-b.y;
  const col=Math.floor((lx-MOTHERSHIP_X0)/MOTHERSHIP_TILE);
  if(col<0||col>=26) return null;
  for(let r=0;r<4;r++){
    const top=bossTileTopY(r);
    if(ly>=top-2 && ly<top+MOTHERSHIP_TILE+2){
      return {r,col,value:b.body[r][col]};
    }
  }
  return null;
}
function bossErodeBodyCell(b,r,col){
  const v=b.body[r][col];
  if(v<0x4C || v>0x4F) return false;
  let nv=v-1;
  if(nv===0x4B){
    b.body[r][col]=0;
    // The tile directly behind the removed edge becomes a fresh $4F edge.
    const behind=r+1;
    if(behind<4 && b.body[behind][col]===0x5E) b.body[behind][col]=0x4F;
  }else{
    b.body[r][col]=nv;
  }
  return true;
}

function resetBossEscortFormation(){
  bossEscortFormation=new Formation(MOTHERSHIP_ESCORT_META, cycle+1);
  bossEscortRespawnTimer=0;
}
function updateBossEscortFormation(dt){
  if(!currentBoss || currentBoss.state==='dead') return;
  if(!bossEscortFormation){
    bossEscortRespawnTimer-=dt;
    if(currentBoss.state==='active' && bossEscortRespawnTimer<=0) resetBossEscortFormation();
    return;
  }

  if(currentBoss.state==='entering'){
    // During the reveal/fade phase the escort is already visible in its exact
    // T15E0 arch, but it does not launch attacks yet.
    for(const b of bossEscortFormation.birds){
      if(!b.alive) continue;
      b.x=b.tickToX;
      b.y=b.tickToY;
      b.flapPhase+=dt*6;
    }
  } else {
    updateSmallFormation(bossEscortFormation,dt);
  }

  if(bossEscortFormation.birds.every(b=>!b.alive)){
    bossEscortFormation=null;
    bossEscortRespawnTimer=0; // level B reloads a fresh 16-alien flock immediately
  }
}

function updateBoss(dt){
  const b=currentBoss;
  b.t+=dt;
  if(b.state==='dead') return;
  b.x=LOGICAL_W/2;

  // The conveyor is alive from the moment the mothership becomes visible.
  b.beltFrameAccum+=dt;
  while(b.beltFrameAccum>=b.beltLogicalPeriod){
    b.beltFrameAccum-=b.beltLogicalPeriod;
    b.beltShift=bossWrapIdx(b.beltShift+1,b.beltHalves.length);
  }

  if(b.state==='entering'){
    b.y=Math.min(b.y+b.entrySpeed*dt,b.entryY);
    if(b.y>=b.entryY){
      b.y=b.entryY;
      b.state='active';
    }
    return;
  }

  // Once the live stage begins it is immediately damageable while continuing
  // the very slow ROM-style descent.  It eventually stops rather than drifting
  // indefinitely through the player.
  b.y=Math.min(b.stopY,b.y+b.descentSpeed*dt);

  b.fireTimer-=dt;
  if(b.fireTimer<=0){
    fireBossBullet(b);
    b.fireTimer=Math.max(0.58,1.05-Math.min(cycle,10)*0.03);
  }
}
function handleBossBulletCollisions(){
  const boss=currentBoss;
  if(!boss || boss.state==='entering' || boss.state==='dead') return;
  const beltTop=boss.y+bossTileTopY(MOTHERSHIP_BELT_ROW);
  const beltBottom=beltTop+MOTHERSHIP_TILE;

  for(const bul of bullets){
    if(!bul.friendly||bul.dead) continue;

    // 1) Exact orange shield/body erosion.  Only $4C-$4F edge tiles are
    // hittable; when one disappears, a $5E directly behind it becomes $4F.
    const cell=bossBodyCellAtBullet(boss,bul);
    if(cell && bossErodeBodyCell(boss,cell.r,cell.col)){
      bul.dead=true;
      VectorSynth.wingHit();
      spawnBurst(bul.x,bul.y,'#ffad18',5);
      continue;
    }

    // 2) Full active width of the conveyor belt: all 18 tiles / 36 halves.
    if(bul.y>=beltTop-2 && bul.y<=beltBottom+2){
      const hit=bossBeltSourceAtX(boss,bul.x);
      if(!hit) continue; // fixed $5C/$5D end caps are not belt tiles in the ROM
      bul.dead=true;

      if(hit.state===1){
        // State 1 is already an opening.  The shot only kills if a $70-range
        // pilot tile sits directly behind this physical belt position.
        if(bossIsPilotHalf(bul.x) && boss.pilotAlive){
          boss.pilotAlive=false;
          boss.state='dead';
          const descendBonus=Math.round(Math.max(0,boss.y-boss.targetY)*18.4);
          const total=1500+descendBonus;
          addScore(total);
          spawnPopup(boss.x,boss.y-12,'+'+total);
          VectorSynth.explosion('boss');
          spawnBurst(boss.x,boss.y,'#ffd23f',50);
          spawnBurst(boss.x,boss.y,'#ff3b1f',50);
        }
        continue;
      }

      boss.beltHalves[hit.source]=bossDamageBeltHalf(hit.state);
      VectorSynth.wingHit();
      spawnBurst(bul.x,bul.y,'#d83bdb',4);
    }
  }
}

/* ---------- collisions ---------- */
function checkCollisions(){
  const p=player;
  if(currentFormation){
    for(const bird of currentFormation.birds){
      if(!bird.alive) continue;
      const dims=bigBirdDims(bird);
      for(const b of bullets){
        if(!b.friendly||b.dead) continue;
        if(circleRectHit(b.x,b.y,b.r, bird.x-dims.w/2, bird.y-dims.h/2, dims.w, dims.h)){
          b.dead=true;
          hitBird(bird,b);
          break;
        }
      }
    }
  }
  if(bossEscortFormation){
    for(const bird of bossEscortFormation.birds){
      if(!bird.alive) continue;
      for(const b of bullets){
        if(!b.friendly||b.dead) continue;
        if(circleRectHit(b.x,b.y,b.r, bird.x-bird.width/2, bird.y-bird.height/2, bird.width, bird.height)){
          b.dead=true;
          killBirdBody(bird);
          break;
        }
      }
    }
  }
  for(const bird of escortBirds){
    if(!bird.alive) continue;
    for(const b of bullets){
      if(!b.friendly||b.dead) continue;
      if(circleRectHit(b.x,b.y,b.r, bird.x-bird.width/2, bird.y-bird.height/2, bird.width, bird.height)){
        b.dead=true; bird.alive=false;
        addScore(100); spawnPopup(bird.x,bird.y,'+100');
        spawnFeatherCloud(bird.x,bird.y,birdFeatherColors(bird),18);
        spawnBurst(bird.x,bird.y,bird.palette[0],3);
        VectorSynth.bonusKill();
        break;
      }
    }
  }
  if(currentBoss) handleBossBulletCollisions();

  if(p.alive && p.invuln<=0){
    for(const b of bullets){
      if(b.friendly||b.dead) continue;
      if(circleRectHit(b.x,b.y,b.r, p.x-p.w/2, p.y-p.h/2, p.w, p.h)){
        b.dead=true;
        if(p.shieldState==='active') void 0; else damagePlayer();
        break;
      }
    }
    if(currentFormation){
      for(const bird of currentFormation.birds){
        if(!bird.alive) continue;
        if(bird.kind==='small' && bird.state!=='diving') continue;
        const dims=bigBirdDims(bird);
        if(rectsOverlap(bird.x-dims.w/2, bird.y-dims.h/2, dims.w, dims.h, p.x-p.w/2, p.y-p.h/2, p.w, p.h)){
          if(p.shieldState==='active'){ void 0; killBirdBody(bird); }
          else { damagePlayer(); killBirdBody(bird); }
        }
      }
    }
    if(bossEscortFormation){
      for(const bird of bossEscortFormation.birds){
        if(!bird.alive || bird.state!=='diving') continue;
        if(rectsOverlap(bird.x-bird.width/2, bird.y-bird.height/2, bird.width, bird.height, p.x-p.w/2, p.y-p.h/2, p.w, p.h)){
          if(p.shieldState==='active'){ void 0; killBirdBody(bird); }
          else { damagePlayer(); killBirdBody(bird); }
        }
      }
    }
    for(const bird of escortBirds){
      if(!bird.alive) continue;
      if(rectsOverlap(bird.x-bird.width/2, bird.y-bird.height/2, bird.width, bird.height, p.x-p.w/2, p.y-p.h/2, p.w, p.h)){
        if(p.shieldState==='active'){ void 0; bird.alive=false; }
        else { damagePlayer(); bird.alive=false; }
      }
    }
    if(currentBoss && currentBoss.state!=='entering' && currentBoss.state!=='dead'){
      if(rectsOverlap(currentBoss.x-currentBoss.width/2, currentBoss.y-currentBoss.height/2, currentBoss.width, currentBoss.height, p.x-p.w/2, p.y-p.h/2, p.w, p.h)){
        if(p.shieldState==='active') void 0; else damagePlayer();
      }
    }
  }
}

function updateHUD(){}
/* ---------- master update ---------- */
function update(dt){
  updatePlayer(dt);
  updateBullets(dt);
  if(currentBoss){ updateBoss(dt); updateBossEscortFormation(dt); }
  else if(currentFormation){ updateFormation(dt); }
  updateParticles(dt);
  updateStars(dt);
  updatePopups(dt);
  checkCollisions();
  checkRoundClear();
  updateHUD();
}

const PHOENIX_BIRD_VISUALS=(function(){
  const api=window.VectorBirdAssets;
  const registry=api && api.registry;
  function safeGet(id){
    return registry ? registry.get(id) : null;
  }
  return {
    smallMarching:safeGet('bird.marching'),
    smallFlying:safeGet('bird.flying'),
    bigVulture:safeGet('vulture.flying'),
    bigDuck:safeGet('duck.flying')
  };
})();

function birdVisualVariant(b){
  if(b.kind==='big'){
    if(currentFormation && currentFormation.kind==='big' && currentFormation.birdVariant===4) return 1;
    return 0;
  }
  if(b.kind==='small'){
    // Formation stamps this directly onto the bird. This is important for
    // level 5: mothership escorts live in bossEscortFormation, not currentFormation.
    if(b.visualVariant===1) return 1;
    if(b.visualVariant===0) return 0;
    // Fallback for any legacy/generated bird object lacking the stamped value.
    if(currentFormation && currentFormation.kind==='small'){
      if(currentFormation.isMothershipEscort) return 1;
      if(currentFormation.levelNibble===0x03) return 1;
    }
  }
  return 0;
}
function birdRenderPalette(b){
  const variant=birdVisualVariant(b);
  // Exact colour values from the other program's bird palette.
  if(variant===1) return { wing:'#ff00f1', body:'#00ff66', eye:'#ffffff', mask:'#000000' };
  return { wing:'#ffff00', body:'#ff00f1', eye:'#ffffff', mask:'#000000' };
}

/* ---------- vector-space collision geometry ----------
   Phoenix still owns every movement/state update.  These helpers only replace
   the old sprite/tile hit masks with geometry matching the vector actors. */
function vcRotatePoint(x,y,a){
  const c=Math.cos(a),s=Math.sin(a);
  return {x:x*c-y*s,y:x*s+y*c};
}
function vcTransformPoly(points,cx,cy,a=0){
  if(!a) return points.map(p=>({x:cx+p[0],y:cy+p[1]}));
  return points.map(p=>{ const q=vcRotatePoint(p[0],p[1],a); return {x:cx+q.x,y:cy+q.y}; });
}
function vcPointInPoly(x,y,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    const hit=((a.y>y)!==(b.y>y)) && (x < (b.x-a.x)*(y-a.y)/((b.y-a.y)||1e-9)+a.x);
    if(hit) inside=!inside;
  }
  return inside;
}
function vcOrient(a,b,c){ return (b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x); }
function vcOnSegment(a,b,p){
  return p.x>=Math.min(a.x,b.x)-1e-6&&p.x<=Math.max(a.x,b.x)+1e-6&&
         p.y>=Math.min(a.y,b.y)-1e-6&&p.y<=Math.max(a.y,b.y)+1e-6;
}
function vcSegmentsIntersect(a,b,c,d){
  const o1=vcOrient(a,b,c),o2=vcOrient(a,b,d),o3=vcOrient(c,d,a),o4=vcOrient(c,d,b);
  if(((o1>0&&o2<0)||(o1<0&&o2>0))&&((o3>0&&o4<0)||(o3<0&&o4>0))) return true;
  if(Math.abs(o1)<1e-7&&vcOnSegment(a,b,c)) return true;
  if(Math.abs(o2)<1e-7&&vcOnSegment(a,b,d)) return true;
  if(Math.abs(o3)<1e-7&&vcOnSegment(c,d,a)) return true;
  if(Math.abs(o4)<1e-7&&vcOnSegment(c,d,b)) return true;
  return false;
}
function vcSegmentHitsPoly(x1,y1,x2,y2,poly){
  if(vcPointInPoly(x1,y1,poly)||vcPointInPoly(x2,y2,poly)) return true;
  const a={x:x1,y:y1},b={x:x2,y:y2};
  for(let i=0,j=poly.length-1;i<poly.length;j=i++) if(vcSegmentsIntersect(a,b,poly[j],poly[i])) return true;
  return false;
}
function vcPolysIntersect(a,b){
  for(const p of a) if(vcPointInPoly(p.x,p.y,b)) return true;
  for(const p of b) if(vcPointInPoly(p.x,p.y,a)) return true;
  for(let i=0,ip=a.length-1;i<a.length;ip=i++){
    for(let j=0,jp=b.length-1;j<b.length;jp=j++) if(vcSegmentsIntersect(a[ip],a[i],b[jp],b[j])) return true;
  }
  return false;
}
function vcSegmentHitsEllipse(x1,y1,x2,y2,cx,cy,rx,ry){
  const ax=(x1-cx)/rx, ay=(y1-cy)/ry, bx=(x2-cx)/rx, by=(y2-cy)/ry;
  const dx=bx-ax,dy=by-ay;
  const A=dx*dx+dy*dy;
  if(A<1e-10) return ax*ax+ay*ay<=1;
  const B=2*(ax*dx+ay*dy), C=ax*ax+ay*ay-1;
  const disc=B*B-4*A*C;
  if(disc<0) return false;
  const root=Math.sqrt(disc),t1=(-B-root)/(2*A),t2=(-B+root)/(2*A);
  return (t1>=0&&t1<=1)||(t2>=0&&t2<=1)||C<=0;
}
function vcPolyHitsEllipse(poly,cx,cy,rx,ry){
  if(vcPointInPoly(cx,cy,poly)) return true;
  for(const p of poly){ const dx=(p.x-cx)/rx,dy=(p.y-cy)/ry; if(dx*dx+dy*dy<=1) return true; }
  for(let i=0,j=poly.length-1;i<poly.length;j=i++) if(vcSegmentHitsEllipse(poly[j].x,poly[j].y,poly[i].x,poly[i].y,cx,cy,rx,ry)) return true;
  return false;
}
function vcSmallBirdPoly(b){
  const inFormation=b.state==='formation'&&b.patternKind==='base';
  const attacking=!inFormation&&b.patternKind==='attack';
  const movingDown=attacking&&(b.visualMoveDY||0)>0;

  const out=[];

})();

// once into a polyline so any x can be looked up.
const MS_HULL_CURVE=(function(){

  for(let c=4;c<=21;c++) pts.push([bossTileLeftX(c)+MOTHERSHIP_TILE/2, MS_HULL_BASE[c]]);

const PHOENIX_HZ = 5500000 / (352 * 256); // 61.03515625 Hz

function mappedPlayerBounds(){
  const x=(player ? player.x : PLAYER_START_X);
  const i=x&7;
  // Normal ROM-range positions are unchanged. Only the deliberate extended
  // edge travel is clipped to the visible logical playfield instead of byte-wrapping.
  return {
    left:clamp(x-PLAYER_LEFT_MAP[i],0,LOGICAL_W),

}
function shieldIsActive(){ return !!player && player.shieldState==='active'; }

  // fresh downward bomb almost on top of the ship. Existing bombs are never
  // removed or slowed. Arcade uses 0 and therefore keeps the ROM behaviour.
  if(cfg.minBombLead>0 && player && sy>=(player.y-cfg.minBombLead)) return false;
  if(!allowEnemyFireAttempt()) return false;

function stepPlayerWeaponsFrame(){
  // The ROM clears a player shot below $1F because the top 32 pixels belong
  // to its score band. Our HUD now lives in the sidebar, so preserve the
  // 8-pixel step but let the visible shot traverse the whole playfield.
  for(const b of bullets){
    if(!b.friendly || b.dead) continue;
    b.y-=8;
    if(b.y<0) b.dead=true;
  }

  // Testing-only cheat: while fire is held, launch an independent shot every
  // three Phoenix frames. These do not occupy the ROM player-bullet slots.
  if(TEST_RAPID_FIRE){
    if(currentFireDown()){
      if(rapidFireCheatFrames<=0){
        spawnPlayerBullet('rapid');
        rapidFireCheatFrames=RAPID_FIRE_CHEAT_INTERVAL-1;
      } else rapidFireCheatFrames--;
    } else rapidFireCheatFrames=0;
    return;
  }
  rapidFireCheatFrames=0;

  // Normal mode stays ROM-style: fresh press only. Level 3 really does have
  // the second bullet slot; the first free slot consumes the press.
  if(!firePressedThisFrame) return;
  const max=romanPlayerBulletSlots();
  for(let slot=0;slot<max;slot++){
    const occupied=bullets.some(b=>b.friendly&&!b.dead&&b.playerSlot===slot);
    if(!occupied){ spawnPlayerBullet(slot); return; }
  }

function stepPlayerFrame(){
  const p=player;
  if(!p || !p.alive || p.deathFrames>0) return;

  if(p.shieldState==='active'){
    p.shieldCounter=(p.shieldCounter-1)&0xFF;
    if(p.shieldCounter===0xC0){
      // ShieldsExpired snaps the low three X bits to 3. Preserve that feel,
      // but clamp the result to the remake's deliberately wider signed range.
      p.x=clamp(Math.floor(p.x/8)*8+3,PLAYER_MIN_X,PLAYER_MAX_X);
      p.shieldState='cooldown';
      p.shieldCounter=difficultyConfig().shieldCooldownFrames;
      p.shieldTimer=p.shieldCounter/PHOENIX_HZ;
      setVectorShieldSound(false);
    }
  } else {
    if(p.shieldCounter>0){
      p.shieldCounter=(p.shieldCounter-1)&0xFF;
      if(p.shieldCounter===0){ p.shieldState='ready'; p.shieldTimer=0; }
      else p.shieldTimer=p.shieldCounter/PHOENIX_HZ;
    }
    let mv=0;
    const keyLeft=keys.has('ArrowLeft')||keys.has('KeyA');
    const keyRight=keys.has('ArrowRight')||keys.has('KeyD');
    if(keyLeft||keyRight){
      // ROM checks left first, so left wins if both directions are held.
      mv=keyLeft?-1:1;
    } else if(touchState.left||touchState.right){
      mv=touchState.left?-1:1;
    } else if(gamepadState.left||gamepadState.right){
      // Standard Gamepad API: D-pad or left stick. Like the ROM and keyboard,
      // left wins if a controller somehow reports both directions at once.
      mv=gamepadState.left?-1:1;
    }
    if(mv<0 && p.x>PLAYER_MIN_X) p.x-=1;
    else if(mv>0 && p.x<PLAYER_MAX_X) p.x+=1;
  }

  stepPlayerWeaponsFrame();

    if(!b.interpFrames){ b.x=b.tickToX; b.y=b.tickToY; continue; }
    b.interpFrame=Math.min(b.interpFrames,b.interpFrame+1);
    const t=b.interpFrame/b.interpFrames;
    b.x=lerpByte(b.interpFromX,b.interpToX,t);
    b.y=lerpByte(b.interpFromY,b.interpToY,t);

smallRomRandom = function(){

romReloadAttackDelay = function(f,aliveCount){

trySmallAlienBombDrop = function trySmallAlienBombDropFidelity(f){

const SMALL_FORMATION_TILE_PAIRS={
  0x20:[0x60,0x61], 0x22:[0x62,0x63], 0x24:[0x64,0x65], 0x26:[0x66,0x67]

const SMALL_T1740=[
  [0x08,0x00, 0], [0x01,0x00,-8], [0x08,0x01, 2], [0x04,0x00,-6],
  [0x08,0x01, 4], [0x08,0x00,-4], [0x08,0x05, 6], [0x08,0x00,-2]

function formationTileMap(f){

    const pair=SMALL_FORMATION_TILE_PAIRS[b.romShapeCode&0xFF];
    if(!pair) continue;
    const cx=(b.tickToX&0xF8), cy=(b.tickToY&0xF8);
    // L0788: first tile at the alien address, second one RightOneColumn.
    map.set(((cx&0xFF)<<8)|(cy&0xFF),pair[0]);

function formationAlienHit(f,shot,tileMap){

  const t=SMALL_T1740[ch-0x60];

  if(px<t[1] || px>=t[0]) return null;
  const targetX=(cellX+t[2])&0xFF;
  const targetY=cellY;

  for(const b of f.birds){
    if(!b.alive) continue;
    const x=b.tickToX&0xFF, y=b.tickToY&0xFF;

function stepSmallLevelDispatcher(f){
  advanceSmallInterpolation(f);
  const alive=f.birds.reduce((n,b)=>n+(b.alive?1:0),0);
  const phase=f.movementCounter&3;
  f.movementCounter=(f.movementCounter+1)&0xFF;

  if(alive===0){
    if(f.isMothershipEscort){
      // L21BA: only the odd phase reloads the level-B 16-alien escort.
      if(phase&1){ stepEnemyBulletsFrame(); bossHousekeepingFrame(currentBoss); resetBossEscortFormation(); }
      return;
    }
    if(phase&1) stepEnemyBulletsFrame();
    f.clearCounter++;
    if(f.clearCounter>=0x60) advanceRound();
    return;
  }

  // L2130 flips permanently into the fast two-phase dispatcher once <5 remain.
  if(!f.fastMode && alive<5 && phase===0) f.fastMode=true;

  if(f.fastMode){
    if((phase&1)===0){
      stepAlienBehaviorScheduler(f,alive);
      processSmallPlayerCollision(f);
      trySmallAlienBombDrop(f);
      stepEnemyBulletsFrame();
    } else {
      stepSmallMovement(f,2);
      updateSmallAlienAnimationPose(f);
      if(f.isMothershipEscort) bossHousekeepingFrame(currentBoss);
    }
    return;
  }

  switch(phase){
    case 0:
      stepAlienBehaviorScheduler(f,alive);
      processSmallPlayerCollision(f);
      break;
    case 1:
      if(f.isMothershipEscort) bossHousekeepingFrame(currentBoss);
      stepEnemyBulletsFrame();
      stepSmallMovement(f,4);
      break;
    case 2:
      updateSmallAlienAnimationPose(f);
      trySmallAlienBombDrop(f);
      break;
    case 3:
      if(f.isMothershipEscort) bossHousekeepingFrame(currentBoss);
      stepEnemyBulletsFrame();
      break;
  }
}

const BIG_BIRD_WIDTH_BY_STATE=[0,2,3,3,3,4,5,6,4,5,6,7,5,7,5,6];

function bigBirdFlapValue(b){

function bigBirdBodyScore(b){

function processBigBirdBulletCollisions(f){
  for(const shot of bullets){

function processBigBirdShieldCollision(f){
  if(!player||!player.alive) return;
  const phase=f.bigBD2&0x1F;
  if(phase<0x0C || phase>=0x1C) return; // L3980 danger band only
  const shielded=shieldIsActive();
  const shipPoly=shielded?null:vcPlayerPoly();
  for(const b of f.birds){
    if(!b.alive || (b.growthState|0)===1) continue;
    const g=vcBigBirdGeometry(b);
    let part=null;
    if(g.egg){
      const hit=shielded
        ? vcSegmentHitsEllipse(player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,g.egg.cx,g.egg.cy,g.egg.rx+16.2,g.egg.ry+17.5)
        : vcPolyHitsEllipse(shipPoly,g.egg.cx,g.egg.cy,g.egg.rx,g.egg.ry);
      if(hit) part='body';
    } else {
      const vis=vcBigBirdVisibleParts(b,g);
      const bodyHit=shielded
        ? (g.body&&vcPolyHitsEllipse(g.body,player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,16.2,17.5))
        : (g.body&&vcPolysIntersect(g.body,shipPoly));
      if(bodyHit) part='body';
      else {
        const leftHit=vis.left&&(shielded?vcPolyHitsEllipse(g.left,player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,16.2,17.5):vcPolysIntersect(g.left,shipPoly));
        const rightHit=vis.right&&(shielded?vcPolyHitsEllipse(g.right,player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,16.2,17.5):vcPolysIntersect(g.right,shipPoly));

    } else {
      beginPlayerDeath();
      break;
    }
  }
}

stepBigBirdBombs = function stepBigBirdBombsFidelity(f,aliveCount,lo){

  for(let n=0;n<count;n++){
    const b=f.birds[start+n];
    if(!b||!b.alive||b.growthState<5) continue;
    const x=b.x&0xFF;
    const inX=left<=right?(x>=left&&x<right):(x>=left||x<right);
    if(!inX) continue;
    const row=((f.bigBD2+(b.screenAddr&0xFF))&0x1F);

  }
};
function stepBigLevelDispatcher(f){
  const lo=romCounter16&0xFF;
  const hi=(romCounter16>>>8)&0xFF;
  const alive=f.birds.reduce((n,b)=>n+(b.alive?1:0),0);
  if(alive===0){
    if((lo&1)===0){

      f.clearCounter++;
      if(f.clearCounter>=0x60) advanceRound();
    }
    return;
  }

  processBigBirdBulletCollisions(f); // L3800 before vertical movement
  for(const b of f.birds){ b.prevX=b.renderX; b.prevY=b.renderY; }
  f.bigCounter16=(romCounter16-1)&0xFFFF;

  processBigBirdBulletCollisions(f); // L3800 again after movement

function createBossEscortForFade(){

function updateBossPreludeY(b){
  const descended=(0x71-b.counterB9)&0xFF;
  b.y=b.entryY-0x78+clamp(descended,0,0x78); // 1px per StarsScrollDown step
}
function stepBossPreludeFrame(b){
  if(b.state==='fade9'){
    // Level 9: T05CC gives CounterB4=$48. L22B4 scrolls once per frame,
    // taking CounterB9 from $71 to $29 over 72 steps.
    b.counterB9=(b.counterB9-1)&0xFF;
    b.phaseCounter--;
    updateBossPreludeY(b);
    b.revealAlpha=clamp((0x48-b.phaseCounter)/48,0,1);
    if(b.phaseCounter<=0){
      b.phaseCounter=0xC0;
      b.state='fadeA';
      b.revealAlpha=1;
    }
    return;
  }
  if(b.state==='fadeA'){
    // L22CA special-cases the first $C0 frame: it seeds $30 without scrolling.

      b.phaseCounter=0x30;
      return;
    }
    b.counterB9=(b.counterB9-1)&0xFF;
    b.phaseCounter--;
    updateBossPreludeY(b);

    if(c<0x15){

      bossEscortFormation.revealAlpha = c>=0x11?0.2 : c>=0x0D?0.4 : c>=0x09?0.6 : c>=0x05?0.8 : 1;
      for(const bird of bossEscortFormation.birds){ bird.x=bird.tickToX; bird.y=bird.tickToY; }
    }
    if(c<=0){
      b.state='active';
      // $71 - $48 - $30 wraps to $F9: the actual level-B starting height.
      b.counterB9=0xF9;
      b.y=b.entryY;

function tryMothershipBomb(b){
  if(!b||b.state!=='active') return;
  const lo=romCounter16&0xFF;
  if((lo&3)!==3) return; // L24A0
  const rnd=smallRomRandom();
  const candidate=(0x60+rnd)&0xFF;
  if(((candidate&0x0E)&lo)!==0) return;
  const pb=mappedPlayerBounds();
  if(candidate<=pb.left||candidate>pb.right) return;
  const y=((((-b.counterB9)&0xF8)+0x48+0x0C)&0xFF);
  spawnEnemyBullet(candidate,y);

function mothershipBonusScore(b){
  let raw=((b.counterB9+0x60)&0xFF);
  raw=rrc8(raw,1);
  const roundNib=((cycle-1)&0x0F)<<4;

function stepPhoenixFrame(){
  romCounter16=(romCounter16+1)&0xFFFF;
  sampleFireInputFrame();
  if(currentBoss && currentBoss.state==='active') currentBoss.beltVisualPhase+=1/8;

  if(stepPlayerDeathFrame()){
    syncVectorSynthState();
    updateParticles(PHOENIX_FRAME); updateStars(PHOENIX_FRAME); updatePopups(PHOENIX_FRAME); updateHUD();
    return;
  }

  if(currentBoss && (currentBoss.state==='fade9'||currentBoss.state==='fadeA')){
    stepBossPreludeFrame(currentBoss);
    syncVectorSynthState();
    updateParticles(PHOENIX_FRAME); updateStars(PHOENIX_FRAME); updatePopups(PHOENIX_FRAME); updateHUD();
    return;
  }

  stepPlayerFrame();

  if(currentBoss){
    if(currentBoss.state==='dead'){
      if(currentBoss.deadFrames>0) currentBoss.deadFrames--;
      if(currentBoss.deadFrames<=0) advanceRound();
    } else if(currentBoss.state==='active'){
      if(bossEscortFormation) processSmallBulletCollisions(bossEscortFormation); // L0DF0
      handleBossBulletCollisions();                        // L24A0 bullet-vs-mothership
      tryMothershipBomb(currentBoss);                      // L24A0 return fire
      if(bossEscortFormation) stepSmallLevelDispatcher(bossEscortFormation);
    }
  } else if(currentFormation){
    if(currentFormation.kind==='small'){
      processSmallBulletCollisions(currentFormation);
      stepSmallLevelDispatcher(currentFormation);
    } else {
      stepBigLevelDispatcher(currentFormation);
    }
  }

  bullets=bullets.filter(b=>!b.dead);
  syncVectorSynthState();
  updateParticles(PHOENIX_FRAME); updateStars(PHOENIX_FRAME); updatePopups(PHOENIX_FRAME); updateHUD();
}

  score=0; cycle=1; roundIndex=0; extraLifeIdx=0; romCounter16=0;

function syncCheatControls(){
  if(cheatInfinite) cheatInfinite.checked=TEST_UNLIMITED_LIVES;
  if(cheatInvulnerable) cheatInvulnerable.checked=TEST_INVULNERABLE;
  if(cheatRapid) cheatRapid.checked=TEST_RAPID_FIRE;
}
if(cheatInfinite) cheatInfinite.addEventListener('change',()=>{ TEST_UNLIMITED_LIVES=cheatInfinite.checked; updateHUD(); });
if(cheatInvulnerable) cheatInvulnerable.addEventListener('change',()=>{ TEST_INVULNERABLE=cheatInvulnerable.checked; });
if(cheatRapid) cheatRapid.addEventListener('change',()=>{ TEST_RAPID_FIRE=cheatRapid.checked; rapidFireCheatFrames=0; });
syncCheatControls();


syncDifficultyControls();
highScore=readHighScore();
hiEl.textContent=String(highScore).padStart(6,'0');

function startAtDifficulty(key){
  chooseDifficulty(key);
  startGame();
}
for(const btn of difficultyStartButtons){
  btn.addEventListener('click',()=>startAtDifficulty(btn.dataset.startDifficulty));
}
for(const btn of difficultyRestartButtons){
  btn.addEventListener('click',()=>startAtDifficulty(btn.dataset.restartDifficulty));
}

  updateHUD = function () { };
  function tick() {                                           // one Phoenix frame (1/61.035 s)
    if (state === 'playing') stepPhoenixFrame();
    else if (state === 'roundclear') {
      sampleFireInputFrame(); transitionFrames--; updateAmbient(PHOENIX_FRAME);
      if (transitionFrames <= 0) { spawnRound(); state = 'playing'; }
    } else { sampleFireInputFrame(); updateAmbient(PHOENIX_FRAME); }
  }
  return {
    tick, keys, gamepadState, tryActivateShield, startAtDifficulty, chooseDifficulty, DIFFICULTIES,

    get score() { return score; }, get hi() { return Math.max(highScore, score); }, get cycle() { return cycle; }, get round() { return roundIndex; },
    get banner() { return roundBannerText; }, get transitionFrames() { return transitionFrames; }, get frame() { return romCounter16; },
