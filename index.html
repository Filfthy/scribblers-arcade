    G.save(); G.beginPath(); G.rect(X(0), Y(0), 208 * K, 256 * K); G.clip();
    drawSpace();
    const Fm = G0.formation;
    if (Fm) {
      if (Fm.kind === 'small') { const pal = SMALL_PAL[Fm.levelNibble === 0x03 ? 1 : 0]; for (const b of Fm.birds) if (b.alive) drawSmallBird(b, pal); }
      else for (const b of Fm.birds) if (b.alive) drawBigBird(b);
    }
    const B = G0.boss;
    if (B) {
      drawMothership(B);
      const E = G0.escort;
      if (E) { const seen = new Set(); for (const b of E.birds) { if (!b.alive) continue; if (B.state === 'fadeA') { const k = (Math.round(b.x) & 255) + ',' + (Math.round(b.y) & 255); if (seen.has(k)) continue; seen.add(k); } drawSmallBird(b, SMALL_PAL[1]); } }
    }
    drawBoom();
    drawBullets();
    drawPlayer();
    drawParticles();
    G.restore();
    // the screen's edges, gone over hard so it's clear where the game ends
    SEEDC = 5060; const RB = rng(5060);
    for (let k = 0; k < 2; k++) {
      pen(line(X(0) - 2 - k * 2, Y(0) - 2, X(0) - 1 - k * 2, Y(256) + 2, RB, 1.2), { w: 2 - k * 0.6, col: INK, seed: 5061 + k });
      pen(line(X(208) + 2 + k * 2, Y(0) - 2, X(208) + 1 + k * 2, Y(256) + 2, RB, 1.2), { w: 2 - k * 0.6, col: INK, seed: 5063 + k });
    }
    pen(line(X(0) - 4, Y(0) - 1, X(208) + 4, Y(0) - 2, RB, 1.5), { w: 1.6, col: INK, seed: 5065 });
    pen(line(X(0) - 4, Y(256) + 1, X(208) + 4, Y(256) + 2, RB, 1.5), { w: 1.6, col: INK, seed: 5066 });
    if (G0.state === 'roundclear' && G0.banner) text(G0.banner, 450, 420, 26, { seed: 96000 + hashStr(G0.banner), align: 'center', col: RED, w: 2, twice: true, p: clamp((0x60 - G0.transitionFrames) / 30, 0, 1) });
    if (st === 'over') drawOverNote();
  }
  function drawOverNote() {
    scrap(450, 400, 440, 170, -0.025, 96100);
    G.save(); G.translate(450, 400); G.rotate(-0.025);
    text('GAME OVER', 0, -22, 48, { seed: 96101, align: 'center', col: RED, w: 2.3, twice: true, p: Math.min(1, overT / 60) });
    text('SCORE ' + lastScore, 0, 16, 17, { seed: 96102 + lastScore % 991, align: 'center', p: Math.min(1, (overT - 40) / 30) });
    if (canRestart()) {
      text(pad.connected ? 'PRESS FIRE OR A TO PLAY AGAIN' : 'PRESS FIRE TO PLAY AGAIN', 0, 46, 15, { seed: 96103, align: 'center', p: Math.min(1, (overT - 110) / 40) });
      text('Q = BACK TO THE ARCADE', 0, 70, 12, { seed: 96104, align: 'center', p: Math.min(1, (overT - 140) / 30) });
    }
    G.restore();
  }
  const canRestart = () => st === 'over' && overT > 110;

  /* ---------------- title page ---------------- */
  const fakeBig = { fake: true, kind: 'big', growthState: 0x0B, renderX: 104, renderY: 72, phase: 0, col: 3, timer: 0x10 };
  const fakeSmall = [0, 1, 2, 3].map(i => ({ state: 'formation', patternKind: 'base', x: 48 + i * 36, y: 112, col: i, romFlap: 0.3, angle: 0 }));
  const fakeEgg = { growthState: 3, renderX: 178, renderY: 96, phase: 0, col: 5 };
  function drawTitle() {
    const tt = stT / 61, P = x => clamp(x, 0, 1);
    text('HI-SCORE ' + String(G0.hi).padStart(6, '0'), 450, 46, 16, { seed: 97001, align: 'center', col: RED, p: P(tt / 0.8) });
    text('PHOENIX', 450, 118, 50, { seed: 97002, align: 'center', p: P((tt - 0.3) / 1.6), w: 2.3, twice: true });
    if (tt > 1.8) {
      // a phoenix flapping over the page, little birds marching under it
      const was = G0.formation;
      fakeBig.renderX = 104 + Math.sin(animT * 0.7) * 30; fakeBig.col = 3;
      for (const b of fakeSmall) b.romFlap = 0.45 + 0.4 * Math.sin(animT * 4 + b.col);
      try { drawBigBird(fakeBig); for (const b of fakeSmall) drawSmallBird(b, SMALL_PAL[b.col & 1]); drawEgg(fakeEgg, 97050); } catch (e) { }
      void was;
    }
    text('-SCORING-', 450, 560, 18, { seed: 97010, align: 'center', col: RED, p: P((tt - 2.6) / 0.8) });
    const L = ['LITTLE BIRDS 20 - SWOOPING 40 OR 200', 'PHOENIX WING 20 - BODY 50 UP TO 800', 'MOTHERSHIP ALIEN 1000 AND UP'];
    L.forEach((s, i) => text(s, 450, 596 + i * 30, 14, { seed: 97011 + i, align: 'center', p: P((tt - 3 - i * 0.4) / 0.8) }));
    // difficulty, chosen with left/right
    const dx = [260, 450, 640];
    DIFF_KEYS.forEach((k, i) => {
      text(DIFF_LABEL[k], dx[i], 468, 17, { seed: 97020 + i, align: 'center', col: k === diff ? RED : INK, w: k === diff ? 1.9 : 1.4, p: P((tt - 2.2) / 0.6) });
      if (k === diff && tt > 2.6) { const R = kidR(97030 + i); pen(loop(dx[i], 462, 74, 22, R, { over: 0.4, wob: 0.04 }), { w: 1.6, col: RED, seed: 97030 + i }); }
    });
    text(DIFF_NOTE[diff], 450, 502, 11, { seed: 97040 + DIFF_KEYS.indexOf(diff), align: 'center' });
    if (tt > 4) text(pad.connected ? 'PRESS FIRE OR A TO PLAY' : 'PRESS FIRE TO PLAY', 450, 710, 22, { seed: 97041, align: 'center', col: RED, w: 1.9, p: P((tt - 4) / 0.8) });
    text('ARROWS MOVE - SPACE FIRES - SHIFT, Z OR DOWN = SHIELD - LEFT/RIGHT HERE PICK HOW HARD - P PAUSE - Q QUITS', 450, 752, 10, { seed: 97042, align: 'center', p: P((tt - 4.5) / 1) });
    text('SOUND TEST 1-9', 450, 776, 10, { seed: 97043, align: 'center', p: P((tt - 5) / 1) });
  }

  return {
    get st() { return st; },
    enter() { st = 'title'; stT = 0; cv.style.cursor = 'default'; },
    leave() { st = 'title'; send({ fn: 'silence', args: [] }); send({ fn: 'shield', args: [false] }); },
    inTitle() { return st === 'title'; },
    canPause() { return st === 'play'; },
    start, canRestart, update, draw, soundTest,
    pauseMusic() { },
    titleKey(d) { const i = clamp(DIFF_KEYS.indexOf(diff) + d, 0, 2); diff = DIFF_KEYS[i]; },
    drawIcon(x, y, sc) {
      G.save(); G.translate(x - X(104) * sc, y - Y(110) * sc); G.scale(sc, sc);
      fakeBig.renderX = 104; fakeBig.col = 5;
      try { drawBigBird(fakeBig); } catch (e) { }
      G.restore();
    },
    get hi() { return G0.hi; },
    game: G0,
    debugPlanets(types) { planets.length = 0; types.forEach((t, i) => planets.push({ x: 50 + i * 60, y: 90 + i * 50, r: 20, type: t, seed: 88500 + i * 131 })); },
  };
})();
/* PX-END */

/* ---------- main loop (fixed 60Hz logic) ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - last; last = now; if (dt > 100) dt = 100;
  clock += dt / 1000;
  pollPad();
  if (!paused && !quitAsk) {
    acc += dt; let n = 0;
    const STEP = game === 'frogger' || game === 'pacman' ? 1000 / 60.606 : game === 'phoenix' ? 1000 / 61.03515625 : 1000 / 60;
    while (acc >= STEP && n < 5) {
      if (game === 'invaders') update();
      else if (game === 'galaxian') GX.update();
      else if (game === 'frogger') FG.update();
      else if (game === 'tetris') TX.update();
      else if (game === 'pacman') PM.update();
      else if (game === 'missile') MC.update();
      else if (game === 'phoenix') PX.update();
      else { menuT++; animT += 1 / 60; fireEdge = false; }
      acc -= STEP; n++;
    }
    if (n === 5) acc = 0;
    gxSend(game === 'galaxian' ? GX.regs(false) : GX_SILENT);
  } else {
    acc = 0;
    if (game === 'invaders') {                          // sound test while paused
      if (testQ.length) { const t = testQ[0]; sndP3 = 0x20 | t[0]; sndP5 = t[1]; if (--t[2] <= 0) testQ.shift(); }
      else { sndP3 = 0; sndP5 = 0; }
      sendPorts();
    } else if (game === 'galaxian') { GX.soundDriver(); gxSend(GX.regs(true)); }
  }
  render();
}
resize();
cv.focus();
requestAnimationFrame(frame);
window.__pi = { get state() { return state; }, newGame, setPaused, get invs() { return invs; }, get game() { return game; }, GX, FG, TX, PM, MC, PX };
</script>
